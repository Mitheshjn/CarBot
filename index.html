<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blockly to Python Generator</title>
  <link rel="icon" href="data:,">

  <!-- External Stylesheet with cache busting -->
  <link rel="stylesheet" href="style.css?v=2">

  <style>
    /* Critical modal & overlay styling to prevent layout bleed */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background: #1e1e1e;
      color: #d4d4d4;
      width: 90%;
      max-width: 820px;
      height: 80vh;
      max-height: 620px;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3c3c3c;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    .modal-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #2d2d30;
      color: #aaa;
      border: 1px solid #3e3e42;
      padding: 6px 14px;
      font-size: 0.88rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #0e639c;
      color: #fff;
      font-weight: 600;
      border-color: #1177bb;
    }
    .modal-close-btn {
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 6px;
    }
    .modal-close-btn:hover {
      color: #fff;
    }
    .modal-body {
      flex: 1;
      display: flex;
      padding: 12px 16px;
      overflow: hidden;
      background: #181818;
    }
    .code-view {
      flex: 1;
      width: 100%;
      background: #141414;
      color: #9cdcfe;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2d2d2d;
      overflow: auto;
      white-space: pre;
      resize: none;
      outline: none;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px 16px;
      background: #252526;
      border-top: 1px solid #333;
    }
    #dragOverlay {
      display: none;
    }
    #toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      font-size: 0.9rem;
      z-index: 10000;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #toast.success { background: #238636; }
    #toast.error { background: #da3633; }
  </style>

  <!-- Blockly Core & Python Engine -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>

  <!-- Custom Block Definitions & Python Generators -->
  <script src="blocks.js?v=test2"></script>
  <script src="python.js?v=test2"></script>
</head>
<body>

  <header>
    <h1>RoverBlocks</h1>
    <div class="header-actions">
      <button onclick="openCodeModal('python')" class="btn-secondary" title="View generated Python & XML">👁 Code</button>
      <button onclick="copyPythonCode()" class="btn-blue" title="Copy Python code">📋 Copy Python</button>
      <button onclick="downloadXml()" class="btn-primary" title="Download workspace as XML file">💾 Download XML</button>
      <button onclick="triggerXmlUpload()" class="btn-amber" title="Upload XML file to load blocks">📂 Upload XML</button>
      <input type="file" id="xmlFileInput" accept=".xml,text/xml" style="display: none;" onchange="handleXmlUpload(event)">
    </div>
  </header>

  <!-- Required DOM Containers -->
  <div id="main-container">
    <div id="blocklyArea">
      <div id="blocklyDiv"></div>
      <div id="dragOverlay">📂 Drop XML file here to load blocks</div>
    </div>
  </div>

  <!-- Code Viewer Modal -->
  <div id="codeModal" class="modal-backdrop" style="display: none;" onclick="handleBackdropClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-tabs">
          <button id="tabPythonBtn" class="tab-btn active" onclick="switchTab('python')">Python</button>
          <button id="tabXmlBtn" class="tab-btn" onclick="switchTab('xml')">XML</button>
        </div>
        <button class="modal-close-btn" onclick="closeCodeModal()" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="modalCodeText" class="code-view" readonly spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button id="modalCopyBtn" class="btn-secondary" onclick="copyModalCode()">📋 Copy</button>
        <button id="modalDownloadXmlBtn" class="btn-primary" style="display: none;" onclick="downloadXml()">💾 Download XML</button>
        <button class="btn-secondary" onclick="closeCodeModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    let workspace;
    let activeTab = 'python';

    // Polyfill / alias for Blockly versions where textToDom is under Blockly.utils.xml
    if (typeof Blockly !== 'undefined') {
      if (Blockly.Xml && !Blockly.Xml.textToDom && Blockly.utils && Blockly.utils.xml && Blockly.utils.xml.textToDom) {
        Blockly.Xml.textToDom = Blockly.utils.xml.textToDom;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // 1. Fetch external toolbox.xml (with cache busting)
        const response = await fetch('toolbox.xml?v=' + new Date().getTime());
        const toolboxText = await response.text();
        const parser = new DOMParser();
        const toolboxXml = parser.parseFromString(toolboxText, 'text/xml').documentElement;

        // 2. Inject Blockly into #blocklyDiv
        workspace = Blockly.inject('blocklyDiv', {
          toolbox: toolboxXml,
          media: 'https://unpkg.com/blockly/media/',
          grid: { spacing: 20, length: 3, colour: '#ccc', snap: true },
          zoom: { controls: true, wheel: true, startScale: 1.0, scaleSpeed: 1.2 },
          move: { scrollbars: { horizontal: true, vertical: true }, drag: true, wheel: false },
          theme: Blockly.Themes.Classic,
          trashcan: true
        });

        // 3. Real-time updates when workspace changes
        workspace.addChangeListener((event) => {
          if (event.isUiEvent) return;
          updateActiveCodeView();
        });

        window.addEventListener('resize', () => Blockly.svgResize(workspace), false);

        // 4. Setup drag and drop for XML files
        setupDragAndDrop();
      } catch (err) {
        console.error('Failed to load toolbox or inject workspace:', err);
      }
    });

    // --- Code Generation ---

    function generatePythonCode() {
      if (!workspace) return '';
      try {
        return Blockly.Python.workspaceToCode(workspace) || '';
      } catch (e) {
        console.error('Error generating Python:', e);
        return '# Error generating code: ' + e.message;
      }
    }

    function generateXmlCode() {
      if (!workspace) return '';
      try {
        const dom = Blockly.Xml.workspaceToDom(workspace);
        return Blockly.Xml.domToPrettyText(dom);
      } catch (e) {
        console.error('Error generating XML:', e);
        return '<!-- Error generating XML: ' + e.message + ' -->';
      }
    }

    // --- Copy & Download Features ---

    function copyPythonCode() {
      const codeText = generatePythonCode();
      if (!codeText.trim()) {
        showToast('No blocks connected yet!', 'error');
        return;
      }
      navigator.clipboard.writeText(codeText).then(() => {
        showToast('Python code copied to clipboard!', 'success');
      }).catch(() => {
        fallbackCopyText(codeText, 'Python code copied!');
      });
    }

    function copyXmlCode() {
      const xmlText = generateXmlCode();
      if (!xmlText.trim()) {
        showToast('No blocks in workspace!', 'error');
        return;
      }
      navigator.clipboard.writeText(xmlText).then(() => {
        showToast('XML code copied to clipboard!', 'success');
      }).catch(() => {
        fallbackCopyText(xmlText, 'XML code copied!');
      });
    }

    function downloadXml() {
      if (!workspace) return;
      const xmlText = generateXmlCode();
      if (!xmlText || xmlText.trim() === '') {
        showToast('Workspace is empty!', 'error');
        return;
      }

      const blob = new Blob([xmlText], { type: 'text/xml;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.href = url;
      a.download = `roverblocks_${timestamp}.xml`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('XML file downloaded!', 'success');
    }

    // --- Upload XML Feature ---

    function triggerXmlUpload() {
      const input = document.getElementById('xmlFileInput');
      if (input) {
        input.value = ''; // Reset so the same file can be selected again
        input.click();
      }
    }

    function handleXmlUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        loadXmlStringToWorkspace(e.target.result, file.name);
      };
      reader.onerror = function() {
        showToast('Failed to read XML file.', 'error');
      };
      reader.readAsText(file);
    }

    function loadXmlStringToWorkspace(xmlText, fileName) {
      if (!workspace) return;
      try {
        let xmlDom;
        if (typeof Blockly.utils !== 'undefined' && Blockly.utils.xml && typeof Blockly.utils.xml.textToDom === 'function') {
          xmlDom = Blockly.utils.xml.textToDom(xmlText);
        } else if (typeof Blockly.Xml !== 'undefined' && typeof Blockly.Xml.textToDom === 'function') {
          xmlDom = Blockly.Xml.textToDom(xmlText);
        } else {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
            throw new Error('Invalid XML syntax.');
          }
          xmlDom = xmlDoc.documentElement;
        }

        workspace.clear();
        Blockly.Xml.domToWorkspace(xmlDom, workspace);
        Blockly.svgResize(workspace);
        
        // Center or scroll to blocks
        const topBlocks = workspace.getTopBlocks(true);
        if (topBlocks.length > 0 && workspace.scrollCenter) {
          workspace.scrollCenter();
        }

        updateActiveCodeView();
        showToast(`Loaded "${fileName || 'XML file'}" successfully!`, 'success');
      } catch (err) {
        console.error('Error importing XML:', err);
        showToast('Error loading XML: ' + err.message, 'error');
      }
    }

    // --- Drag and Drop Feature ---

    function setupDragAndDrop() {
      const mainContainer = document.getElementById('main-container');
      const overlay = document.getElementById('dragOverlay');

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (overlay) overlay.style.display = 'flex';
      });

      window.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null && overlay) {
          overlay.style.display = 'none';
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (overlay) overlay.style.display = 'none';

        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          if (file.name.toLowerCase().endsWith('.xml') || file.type === 'text/xml') {
            const reader = new FileReader();
            reader.onload = (evt) => loadXmlStringToWorkspace(evt.target.result, file.name);
            reader.readAsText(file);
          } else {
            showToast('Please drop a valid .xml file.', 'error');
          }
        }
      });
    }

    // --- Modal & Code View Tab Logic ---

    function openCodeModal(tab = 'python') {
      const modal = document.getElementById('codeModal');
      if (!modal) return;
      modal.style.display = 'flex';
      switchTab(tab);
    }

    function closeCodeModal() {
      const modal = document.getElementById('codeModal');
      if (modal) modal.style.display = 'none';
    }

    function handleBackdropClick(event) {
      if (event.target.id === 'codeModal') {
        closeCodeModal();
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabPythonBtn = document.getElementById('tabPythonBtn');
      const tabXmlBtn = document.getElementById('tabXmlBtn');
      const downloadBtn = document.getElementById('modalDownloadXmlBtn');

      if (tab === 'python') {
        tabPythonBtn.classList.add('active');
        tabXmlBtn.classList.remove('active');
        if (downloadBtn) downloadBtn.style.display = 'none';
      } else {
        tabXmlBtn.classList.add('active');
        tabPythonBtn.classList.remove('active');
        if (downloadBtn) downloadBtn.style.display = 'inline-flex';
      }

      updateActiveCodeView();
    }

    function updateActiveCodeView() {
      const textarea = document.getElementById('modalCodeText');
      if (!textarea) return;

      if (activeTab === 'python') {
        textarea.value = generatePythonCode() || '# No blocks in workspace.';
      } else {
        textarea.value = generateXmlCode() || '<!-- No blocks in workspace. -->';
      }
    }

    function copyModalCode() {
      const textarea = document.getElementById('modalCodeText');
      if (!textarea || !textarea.value) return;

      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast((activeTab === 'python' ? 'Python' : 'XML') + ' copied to clipboard!', 'success');
      }).catch(() => {
        fallbackCopyText(textarea.value, (activeTab === 'python' ? 'Python' : 'XML') + ' copied!');
      });
    }

    function fallbackCopyText(text, successMsg) {
      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('Failed to copy text', 'error');
      }
      document.body.removeChild(tempArea);
    }

    // --- Toast Notification ---

    let toastTimer;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;

      toast.textContent = message;
      toast.className = 'show ' + (type === 'error' ? 'error' : 'success');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.className = '';
      }, 2500);
    }
  </script>
</body>
</html>
