<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blockly to Python Generator</title>
  <link rel="icon" href="data:,">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Mobile-safe viewport fix for Android WebView */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed; /* Prevents elastic scroll & sizing collapse */
    }

    #main-container {
      width: 100%;
      height: calc(100% - 50px);
      position: relative;
      display: flex;
    }

    #blocklyArea {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #blocklyDiv {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Modal & Dialog Styling */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background: #1e1e1e;
      color: #d4d4d4;
      width: 90%;
      max-width: 820px;
      height: 80vh;
      max-height: 620px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3c3c3c;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    .modal-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: #2d2d30;
      color: #aaa;
      border: 1px solid #3e3e42;
      padding: 6px 14px;
      font-size: 0.88rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #0e639c;
      color: #fff;
      font-weight: 600;
      border-color: #1177bb;
    }
    .modal-close-btn {
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      display: flex;
      padding: 12px 16px;
      overflow: hidden;
      background: #181818;
    }
    .code-view {
      flex: 1;
      width: 100%;
      background: #141414;
      color: #9cdcfe;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2d2d2d;
      overflow: auto;
      white-space: pre;
      resize: none;
      outline: none;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px 16px;
      background: #252526;
      border-top: 1px solid #333;
    }
    #dragOverlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(79, 99, 210, 0.15);
      border: 3px dashed #4f63d2;
      border-radius: 8px;
      z-index: 150;
      pointer-events: none;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: #3344a0;
    }
    #dragOverlay.active { display: flex; }
    #toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      z-index: 10000;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: #238636; }
    #toast.error { background: #da3633; }

    /* Custom Floating Controls */
    .workspace-floating-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      user-select: none;
    }
    .workspace-floating-controls .ctrl-btn {
      background: #ffffff;
      color: #24292e;
      border: 1px solid #d0d7de;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 0 10px;
      min-width: 44px;
      height: 38px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .workspace-floating-controls .ctrl-btn-danger {
      font-size: 0.82rem;
      color: #cf222e;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .workspace-floating-controls .ctrl-btn-danger.drag-over {
      background: #ffebe9;
      border-color: #cf222e;
      transform: scale(1.12);
      box-shadow: 0 4px 14px rgba(207, 34, 46, 0.35);
    }

    /* Variable Name Dialog */
    #varDialogBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 20, 35, 0.40);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    #varDialogBackdrop.open { display: flex; }
    #varDialog {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: min(92vw, 360px);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #varDialogInner { padding: 22px 20px 18px; }
    #varDialogTitle {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1f2e;
      margin-bottom: 16px;
    }
    #varDialogInput {
      width: 100%;
      background: #f7f8fc;
      border: 1.5px solid #dde1f0;
      border-radius: 8px;
      font-size: 0.9rem;
      padding: 10px 12px;
      outline: none;
    }
    #varDialogError {
      font-size: 0.72rem;
      color: #d93025;
      margin-top: 5px;
      display: none;
    }
    #varDialogError.visible { display: block; }
    #varDialogFooter {
      display: flex;
      gap: 8px;
      padding: 0 20px 18px;
      justify-content: flex-end;
    }
    .vd-btn {
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
    }
    .vd-btn-cancel { background: #f0f2f8; color: #5a627a; }
    .vd-btn-ok { background: #4f63d2; color: #fff; }
  </style>

  <!-- Blockly Core & Python Engine -->
  <script src="blockly.min.js"></script>
  <script src="python_compressed.js"></script>
  <script src="blocks.js"></script>
  <script src="python.js"></script>
</head>
<body>

  <header>
    <h1></h1>
    <div class="header-actions">
      <button onclick="openCodeModal('python')" class="btn-secondary">View Code</button>
      <button onclick="copyPythonCode()" class="btn-blue">Copy Python</button>
      <button onclick="downloadXml()" class="btn-primary">Download XML</button>
      <button onclick="triggerXmlUpload()" class="btn-amber">Upload XML</button>
      <input type="file" id="xmlFileInput" accept=".xml,text/xml,application/xml" style="display: none;" onchange="handleXmlUpload(event)">
    </div>
  </header>

  <div id="main-container">
    <div id="blocklyArea">
      <div id="blocklyDiv"></div>
      <div id="dragOverlay">Drop XML file here</div>

      <div class="workspace-floating-controls" id="workspaceControls">
        <button type="button" class="ctrl-btn" onclick="workspaceResetZoom()">Center</button>
        <button type="button" class="ctrl-btn" onclick="workspaceZoomIn()">+</button>
        <button type="button" class="ctrl-btn" onclick="workspaceZoomOut()">−</button>
        <button type="button" class="ctrl-btn ctrl-btn-danger" id="btnDelete" onclick="deleteSelectedBlock()" title="Drag a block here to delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- INLINE TOOLBOX: Completely avoids fetch(), CORS, and 404 errors -->
  <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">
    <category name="Logic" colour="#ffb400">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="Loops" colour="#123456">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number"><field name="NUM">10</field></shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
        <value name="BY"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Math" colour="#008000">
      <block type="lists_create_with"><mutation items="0"></mutation></block>
      <block type="lists_create_with"><mutation items="3"></mutation></block>
      <block type="math_number"><field name="NUM">123</field></block>
      <block type="math_arithmetic">
        <value name="A"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="B"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="math_single"><value name="NUM"><shadow type="math_number"><field name="NUM">9</field></shadow></value></block>
      <block type="math_trig"><value name="NUM"><shadow type="math_number"><field name="NUM">45</field></shadow></value></block>
      <block type="math_constant"></block>		
      <block type="math_number_property"><value name="NUMBER_TO_CHECK"><shadow type="math_number"><field name="NUM">0</field></shadow></value></block>
      <block type="math_round"><value name="NUM"><shadow type="math_number"><field name="NUM">3.1</field></shadow></value></block>
      <block type="math_random_int">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
    </category>
    <category name="Text" colour="160">
      <block type="text"></block>
      <block type="text_print">
        <value name="TEXT"><shadow type="text"><field name="TEXT">Hello</field></shadow></value>
      </block>
      <block type="text_join"></block>
      <block type="text_length"></block>
    </category>
    <category name="Variables" colour="330" custom="VARIABLE"></category>
    <category name="Motor" colour="110">
      <block type="lib_left_motor_initialize"></block>
      <block type="lib_right_motor_initialize"></block>
      <block type="lib_motor_rotate"></block>
    </category>
    <category name="ARGB" colour="224">
      <block type="lib_argb_initialize"></block>
      <block type="lib_argb_clear"></block>
      <block type="lib_argb_clear_all"></block>
      <block type="lib_argb_show"></block>
      <block type="lib_argb_red"></block>
      <block type="lib_argb_green"></block>
      <block type="lib_argb_blue"></block>
      <block type="lib_argb_set">
        <value name="red"><shadow type="math_number"><field name="NUM">255</field></shadow></value>
        <value name="green"><shadow type="math_number"><field name="NUM">255</field></shadow></value>
        <value name="blue"><shadow type="math_number"><field name="NUM">255</field></shadow></value>
      </block>
    </category>
    <category name="Servo" colour="230">
      <block type="lib_servo_initialize">
        <value name="step"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
        <value name="delay"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
      </block>
      <block type="lib_servo_rotate"></block>
    </category>
    <category name="MPU6050" colour="224">
      <block type="lib_mpu6050_initialize"></block>
      <block type="lib_mpu6050_enable_gyro"></block>
      <block type="lib_mpu6050_disable_gyro"></block>
      <block type="lib_mpu6050_get_gyro"></block>
      <block type="lib_mpu6050_enable_accel"></block>
      <block type="lib_mpu6050_disable_accel"></block>
      <block type="lib_mpu6050_get_accel"></block>
    </category>
    <category name="TOF" colour="180">
      <block type="lib_tof_initialize"></block>
      <block type="lib_tof_read_distance"></block>
    </category>
    <category name="LDR" colour="165">
      <block type="lib_ldr_initialize"></block>
      <block type="lib_ldr_read"></block>
    </category>
    <category name="OLED" colour="180">
      <block type="lib_display_oled_initialize"></block>
      <block type="lib_display_oled_clear"></block>
      <block type="lib_display_oled_show"></block>
      <block type="lib_display_oled_draw_pixel"></block>
      <block type="lib_display_oled_draw_text"></block>
    </category>
    <category name="Buzzer" colour="32">
      <block type="lib_buzzer_initialize"></block>
      <block type="lib_buzzer_on"></block>
      <block type="lib_buzzer_off"></block>
      <block type="lib_buzzer_buzz">
        <value name="secs"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
    </category>
    <category name="DHT22" colour="120">
      <block type="lib_dht22_initialize"></block>
      <block type="lib_temperature_read"></block>
      <block type="lib_humidity_read"></block>
    </category>
    <category name="System" colour="60">
      <block type="lib_neo_sleep">
        <value name="duration"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="lib_neo_sleep_ms">
        <value name="duration"><shadow type="math_number"><field name="NUM">500</field></shadow></value>
      </block>
    </category>
  </xml>

  <!-- Code Viewer Modal -->
  <div id="codeModal" class="modal-backdrop" onclick="handleBackdropClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-tabs">
          <button id="tabPythonBtn" class="tab-btn active" onclick="switchTab('python')">Python</button>
          <button id="tabXmlBtn" class="tab-btn" onclick="switchTab('xml')">XML</button>
        </div>
        <button class="modal-close-btn" onclick="closeCodeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="modalCodeText" class="code-view" readonly spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button id="modalCopyBtn" class="btn-secondary" onclick="copyModalCode()">📋 Copy</button>
        <button id="modalDownloadXmlBtn" class="btn-primary" style="display: none;" onclick="downloadXml()">💾 Download XML</button>
        <button class="btn-secondary" onclick="closeCodeModal()">Close</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Custom Variable Dialog -->
  <div id="varDialogBackdrop" role="dialog">
    <div id="varDialog">
      <div id="varDialogInner">
        <div id="varDialogTitle">New Variable</div>
        <input id="varDialogInput" type="text" placeholder="e.g. speed, count" autocomplete="off" spellcheck="false" maxlength="64">
        <div id="varDialogError"></div>
      </div>
      <div id="varDialogFooter">
        <button class="vd-btn vd-btn-cancel" id="varDialogCancelBtn" type="button">Cancel</button>
        <button class="vd-btn vd-btn-ok" id="varDialogOkBtn" type="button">Create</button>
      </div>
    </div>
  </div>

  <script>
    let workspace;
    let activeTab = 'python';

    // Variable dialog helper
    (function () {
      const backdrop  = document.getElementById('varDialogBackdrop');
      const input     = document.getElementById('varDialogInput');
      const okBtn     = document.getElementById('varDialogOkBtn');
      const cancelBtn = document.getElementById('varDialogCancelBtn');
      const errorEl   = document.getElementById('varDialogError');
      let _resolve = null;

      window._showVarDialog = function(defaultVal) {
        return new Promise((resolve) => {
          _resolve = resolve;
          input.value = defaultVal || '';
          errorEl.textContent = '';
          errorEl.classList.remove('visible');
          backdrop.classList.add('open');
          setTimeout(() => { try { input.focus(); } catch(_) {} }, 80);
        });
      };

      function confirmDialog() {
        const name = input.value.trim();
        if (!name) {
          errorEl.textContent = 'Name cannot be empty.';
          errorEl.classList.add('visible');
          return;
        }
        backdrop.classList.remove('open');
        if (_resolve) { _resolve(name); _resolve = null; }
      }

      okBtn.addEventListener('click', confirmDialog);
      cancelBtn.addEventListener('click', () => {
        backdrop.classList.remove('open');
        if (_resolve) { _resolve(null); _resolve = null; }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmDialog();
        if (e.key === 'Escape') backdrop.classList.remove('open');
      });

      function patchBlocklyDialog() {
        if (typeof Blockly === 'undefined') return;
        if (Blockly.dialog && typeof Blockly.dialog.setPrompt === 'function') {
          Blockly.dialog.setPrompt((msg, def, cb) => window._showVarDialog(def).then(cb));
        } else if (typeof Blockly.prompt === 'function') {
          Blockly.prompt = (msg, def, cb) => window._showVarDialog(def).then(cb);
        }
      }
      setTimeout(patchBlocklyDialog, 300);
    })();

    // Workspace initialization
    function initBlockly() {
      const toolboxElement = document.getElementById('toolbox');

      workspace = Blockly.inject('blocklyDiv', {
        toolbox: toolboxElement,
        grid: { spacing: 20, length: 3, colour: '#ccc', snap: true },
        zoom: { controls: false, wheel: true, startScale: 1.0, scaleSpeed: 1.2 },
        move: { scrollbars: { horizontal: true, vertical: true }, drag: true, wheel: false },
        theme: Blockly.Themes.Classic,
        trashcan: false
      });

      // Force SVG resize to prevent clipped/invisible workspace on Android
      setTimeout(() => {
        Blockly.svgResize(workspace);
      }, 100);

      window.addEventListener('resize', () => Blockly.svgResize(workspace), false);
      setupDragToDelete();
      setupXmlDragAndDrop();
    }

    function setupXmlDragAndDrop() {
      const overlay = document.getElementById('dragOverlay');
      if (!overlay) return;

      let counter = 0;
      window.addEventListener('dragenter', (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
          counter++;
          overlay.classList.add('active');
        }
      });
      window.addEventListener('dragleave', () => {
        counter = Math.max(0, counter - 1);
        if (counter === 0) overlay.classList.remove('active');
      });
      window.addEventListener('dragover', (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
          e.preventDefault();
        }
      });
      window.addEventListener('drop', (e) => {
        counter = 0;
        overlay.classList.remove('active');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          e.preventDefault();
          const file = e.dataTransfer.files[0];
          if (file.name.toLowerCase().endsWith('.xml') || file.type.includes('xml')) {
            loadXmlFile(file);
          } else {
            showToast('Please drop an XML file', 'error');
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initBlockly);

    // Zoom controls
    function workspaceResetZoom() { if (workspace) { workspace.setScale(1.0); workspace.scrollCenter(); } }
    function workspaceZoomIn() { if (workspace) workspace.zoom(0, 0, 1); }
    function workspaceZoomOut() { if (workspace) workspace.zoom(0, 0, -1); }
    function deleteSelectedBlock() {
      if (workspace) {
        const selected = Blockly.selected;
        if (selected && typeof selected.dispose === 'function') {
          selected.dispose(true, true);
          showToast('Block deleted', 'success');
        } else {
          showToast('Drag a block here to delete it', 'info');
        }
      }
    }

    function setupDragToDelete() {
      const deleteBtn = document.getElementById('btnDelete');
      if (!deleteBtn || !workspace) return;

      // 1. Official Blockly ComponentManager DeleteArea registration
      if (workspace.getComponentManager && Blockly.ComponentManager && Blockly.ComponentManager.Capability) {
        try {
          const deleteArea = {
            id: 'deleteButtonArea',
            getClientRect: function () {
              const r = deleteBtn.getBoundingClientRect();
              return new Blockly.utils.Rect(r.top, r.bottom, r.left, r.right);
            },
            wouldDelete: function (element, couldConnect) {
              return true;
            }
          };
          workspace.getComponentManager().addComponent({
            component: deleteArea,
            weight: 0,
            capabilities: [Blockly.ComponentManager.Capability.DELETE_AREA]
          });
        } catch (err) {
          console.warn('ComponentManager deleteArea:', err);
        }
      }

      // 2. Gesture / Pointer-based drop detection (works across desktop & touch)
      let isDraggingBlock = false;
      let activeDragBlockId = null;
      let lastPointerX = 0, lastPointerY = 0;

      function isOverDeleteBtn(x, y) {
        const r = deleteBtn.getBoundingClientRect();
        return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      }

      function updatePointerPos(x, y) {
        lastPointerX = x;
        lastPointerY = y;
        if (isDraggingBlock) {
          if (isOverDeleteBtn(x, y)) {
            deleteBtn.classList.add('drag-over');
          } else {
            deleteBtn.classList.remove('drag-over');
          }
        }
      }

      document.addEventListener('pointermove', (e) => updatePointerPos(e.clientX, e.clientY), { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) updatePointerPos(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      function handleDropDelete(blockId) {
        const wasOver = isOverDeleteBtn(lastPointerX, lastPointerY);
        deleteBtn.classList.remove('drag-over');

        if (wasOver) {
          const targetId = blockId || activeDragBlockId;
          const block = targetId ? workspace.getBlockById(targetId) : Blockly.selected;
          if (block && typeof block.dispose === 'function' && !block.isDeadOrDying?.()) {
            block.dispose(true, true);
            showToast('Block deleted', 'success');
          }
        }
      }

      workspace.addChangeListener((e) => {
        if (e.type === Blockly.Events.BLOCK_DRAG) {
          if (e.isStart) {
            isDraggingBlock = true;
            activeDragBlockId = e.blockId;
          } else {
            handleDropDelete(e.blockId);
            isDraggingBlock = false;
            activeDragBlockId = null;
          }
        }
      });

      document.addEventListener('pointerup', () => {
        if (isDraggingBlock) {
          handleDropDelete();
          isDraggingBlock = false;
          activeDragBlockId = null;
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (isDraggingBlock) {
          handleDropDelete();
          isDraggingBlock = false;
          activeDragBlockId = null;
        }
      }, { passive: true });
    }

    // Code generators
    function generatePythonCode() {
      if (!workspace) return '';
      try { return Blockly.Python.workspaceToCode(workspace) || ''; }
      catch (e) { return '# Error: ' + e.message; }
    }
    // ---------- Robust XML helpers ----------
    function textToDom(text) {
      // Works with both old and new Blockly
      if (Blockly.utils && Blockly.utils.xml && typeof Blockly.utils.xml.textToDom === 'function') {
        return Blockly.utils.xml.textToDom(text);
      }
      return Blockly.Xml.textToDom(text);
    }

    function generateXmlCode() {
      if (!workspace) return '';
      try {
        // skipId = true → cleaner XML without random block IDs
        const dom = Blockly.Xml.workspaceToDom(workspace, true);

        // Prefer pretty text; fall back to compact if pretty is broken
        if (typeof Blockly.Xml.domToPrettyText === 'function') {
          return Blockly.Xml.domToPrettyText(dom);
        }
        return Blockly.Xml.domToText(dom);
      } catch (e) {
        console.error(e);
        return '<!-- Error generating XML: ' + e.message + ' -->';
      }
    }

    function copyPythonCode() {
      const code = generatePythonCode();
      if (!code.trim()) { showToast('No blocks yet!', 'error'); return; }
      navigator.clipboard.writeText(code).then(() => showToast('Python copied!', 'success'))
      .catch(() => showToast('Copied!', 'success'));
    }

    function downloadXml() {
      if (!workspace) return;
      if (workspace.getAllBlocks(false).length === 0) {
        showToast('No blocks to download!', 'error');
        return;
      }

      const xml = generateXmlCode();
      if (!xml || xml.startsWith('<!-- Error')) {
        showToast('Could not generate valid XML', 'error');
        return;
      }

      // Method that works better in Android WebViews
      try {
        const blob = new Blob([xml], { type: 'text/xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'rover_blocks.xml';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 250);
        showToast('XML downloaded!', 'success');
      } catch (e) {
        // Fallback for stubborn WebViews – open as data URL
        const dataUrl = 'data:text/xml;charset=utf-8,' + encodeURIComponent(xml);
        window.open(dataUrl, '_blank');
        showToast('XML opened (save it manually)', 'success');
      }
    }

    function triggerXmlUpload() {
      const el = document.getElementById('xmlFileInput');
      if (el) {
        el.value = '';
        el.click();
      }
    }

    function loadXmlText(rawText) {
      if (!rawText || !rawText.trim()) {
        showToast('XML file is empty', 'error');
        return;
      }
      try {
        // Remove BOM and normalize
        const cleaned = rawText.replace(/^\uFEFF/, '').trim();

        // Ensure it is wrapped in <xml> (some exports omit it)
        let xmlText = cleaned;
        if (!cleaned.toLowerCase().startsWith('<xml')) {
          xmlText = '<xml xmlns="https://developers.google.com/blockly/xml">' + cleaned + '</xml>';
        }

        const xml = textToDom(xmlText);
        workspace.clear();
        Blockly.Xml.domToWorkspace(xml, workspace);
        Blockly.svgResize(workspace);
        workspace.scrollCenter();
        showToast('Blocks loaded successfully!', 'success');
      } catch (err) {
        console.error('XML Upload Error:', err);
        showToast('Invalid XML file – ' + (err.message || 'parse error'), 'error');
      }
    }

    function handleXmlUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => loadXmlText(evt.target.result);
      reader.onerror = () => showToast('Failed to read file', 'error');
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    }

    // Modal tabs
    function openCodeModal(tab) {
      document.getElementById('codeModal').style.display = 'flex';
      switchTab(tab);
    }
    function closeCodeModal() {
      document.getElementById('codeModal').style.display = 'none';
    }
    function handleBackdropClick(e) {
      if (e.target.id === 'codeModal') closeCodeModal();
    }
    function switchTab(tab) {
      activeTab = tab;
      const pyBtn = document.getElementById('tabPythonBtn');
      const xmlBtn = document.getElementById('tabXmlBtn');
      const dlXmlBtn = document.getElementById('modalDownloadXmlBtn');
      const txt = document.getElementById('modalCodeText');
      if (tab === 'python') {
        pyBtn.classList.add('active'); xmlBtn.classList.remove('active');
        if (dlXmlBtn) dlXmlBtn.style.display = 'none';
        txt.value = generatePythonCode();
      } else {
        xmlBtn.classList.add('active'); pyBtn.classList.remove('active');
        if (dlXmlBtn) dlXmlBtn.style.display = 'inline-block';
        txt.value = generateXmlCode();
      }
    }
    function copyModalCode() {
      const txt = document.getElementById('modalCodeText').value;
      navigator.clipboard.writeText(txt).then(() => showToast('Copied!', 'success'));
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + (type || 'success');
      setTimeout(() => t.className = '', 2500);
    }
  </script>
</body>
</html>
