            --primary-accent: #3b82f6;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #workspace-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            width: 100%;
            height: 100%;
        }

        .app-block {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .app-block.active {
            display: flex;
        }

        .vision-video-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #09090b;
        }

        .vision-canvas-feed {
            width: 100%;
            height: 100%;
            object-fit: fill !important;
            transform: scaleX(-1);
            display: block;
        }

        .vision-canvas-feed.unflipped {
            transform: none !important;
        }

            flex-direction: column;
            height: 100%;
            background: #000;
        }

            height: 100%;
            background: #000;

    <script>
function forceReleaseCamera(videoElement) {
  if (videoElement && videoElement.srcObject) {
    try {
      const tracks = videoElement.srcObject.getTracks();
      tracks.forEach(track => {
        track.stop();
        track.enabled = false;
      });
    } catch (e) { }
    videoElement.srcObject = null;
  }
}

async function getCameraStream(facingMode) {
  try {
    return await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: facingMode }, width: { ideal: 480 }, height: { ideal: 360 } },
      audio: false
    });
  } catch (err) {
    // If exact or ideal facingMode fails due to NotReadableError, try generic video constraint
    return await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 480 }, height: { ideal: 360 } },
      audio: false
    });
  }
}

function forceReleaseAllCameras() {
  try { document.querySelectorAll('video').forEach(v => forceReleaseCamera(v)); } catch (e) { }
}

const __originalGetUserMedia = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
  ? navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices) : null;

if (navigator.mediaDevices && __originalGetUserMedia) {
  navigator.mediaDevices.getUserMedia = async function (constraints) {
    let lastErr;
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        forceReleaseAllCameras();
        if (attempt > 0) await new Promise(res => setTimeout(res, 250 * attempt));
        return await __originalGetUserMedia(constraints);
      } catch (err) {
        lastErr = err;
        if (err && err.name === 'NotReadableError' && attempt < 4) {
          await new Promise(res => setTimeout(res, 300 * (attempt + 1)));
          continue;
        }
        throw err;
      }
    }
    throw lastErr;
  };
}


        function isMediapipeLog(msg) {
            if (typeof msg !== 'string') return false;
            return msg.startsWith('I0000') || msg.startsWith('W0000') || msg.startsWith('E0000') || msg.includes('gl_context');
        }
        const _warn = console.warn;
        console.warn = function (...args) { if (isMediapipeLog(args[0])) return; _warn.apply(console, args); };
        const _log = console.log;
        console.log = function (...args) { if (isMediapipeLog(args[0])) return; _log.apply(console, args); };
        const _err = console.error;
        console.error = function (...args) { if (isMediapipeLog(args[0])) return; _err.apply(console, args); };

        class LandmarkKNNClassifier {
            constructor(k = 5) {
                this.k = k;
                this.data = [];
            }
            addExample(features, label) {
                this.data.push({ features, label });
            }
            clear() {
                this.data = [];
            }
            predict(features) {
                if (this.data.length === 0) return null;
                let distances = [];
                for (let i = 0; i < this.data.length; i++) {
                    let dist = 0;
                    for (let j = 0; j < features.length; j++) {
                        dist += Math.pow(features[j] - this.data[i].features[j], 2);
                    }
                    distances.push({ dist: dist, label: this.data[i].label });
                }
                distances.sort((a, b) => a.dist - b.dist);
                let kNearest = distances.slice(0, this.k);
                let counts = {};
                for (let neighbor of kNearest) {
                    counts[neighbor.label] = (counts[neighbor.label] || 0) + 1;
                }
                let maxCount = -1;
                let prediction = null;
                for (let label in counts) {
                    if (counts[label] > maxCount) {
                        maxCount = counts[label];
                        prediction = parseInt(label);
                    }
                }
                return prediction;
            }
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = max, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) h = 0;
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s, v: v };
        }

        function hsvToRgb(h, s, v) {
            let r, g, b, i = Math.floor(h / 60);
            let f = h / 60 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        function hueDist(h1, h2) {
            let d = Math.abs(h1 - h2);
            return Math.min(d, 360 - d);
        }

        const globalEsp32Url = 'http://192.168.4.10:81/stream';

        window.globalCamModeIndex = 0;
        const CAM_MODES = ['user', 'environment', 'esp32'];
        const CAM_ICONS = ['📷', '🔄', '📡'];

        function updateCanvasTransform(element) {
            if (!element) return;
            if (window.globalCamModeIndex === 0) {
                element.classList.remove('unflipped');
            } else {
                element.classList.add('unflipped');
            }
        }

        function cycleCameraMode() {
            window.globalCamModeIndex = (window.globalCamModeIndex + 1) % 3;
            if (window._activeVisionModule && window._activeVisionModule.restartCamera) {
                window._activeVisionModule.restartCamera();
            } else if (window._activeVisionModule && window._activeVisionModule.restartEsp32) {
                window._activeVisionModule.restartEsp32();
            }
            try {
                window.parent.postMessage({
                    action: 'cam_mode_changed',
                    modeIndex: window.globalCamModeIndex,
                    icon: CAM_ICONS[window.globalCamModeIndex],
                    mode: CAM_MODES[window.globalCamModeIndex]
                }, '*');
            } catch (e) { }
        }
        window.cycleCameraMode = cycleCameraMode;

        function createEsp32ImgSource(url) {
            const img = document.createElement('img');
            img.style.display = 'none';
            img.crossOrigin = "anonymous";
            img.src = url;
            return img;
        }

        // Shared Offscreen Canvas for MediaPipe ESP32 frame extraction
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = 480;
        offscreenCanvas.height = 360;
        const offscreenCtx = offscreenCanvas.getContext('2d');

        // MODULE 1: FINGER TRACKING CONTROLLER
        const FingerTrackingModule = (() => {
            let camera = null;
            let hands = null;
            let currentFacingMode = 'user';
            let isRunning = false;
            let esp32Img = null;
            let esp32AnimId = null;
            let isProcessing = false;
            let ftCameraSession = 0;

            const fingerCountDisplay = document.getElementById('ft-fingerCount');
            const videoElement = document.getElementById('ft-video');
            const canvasElement = document.getElementById('ft-output_canvas');
            const canvasCtx = canvasElement.getContext('2d');

            function setCanvasDimensions() {
                canvasElement.width = 480;
                canvasElement.height = 360;
                updateCanvasTransform(canvasElement);
            }

            function countFingers(lmlist) {
                let fingerCount = 0;
                const tipIds = [4, 8, 12, 16, 20];
                let isRightHand = lmlist[12][1] > lmlist[20][1];
                const isThumbRaised = isRightHand
                    ? lmlist[tipIds[0]][1] > lmlist[tipIds[0] - 1][1]
                    : lmlist[tipIds[0]][1] < lmlist[tipIds[0] - 1][1];
                if (isThumbRaised) fingerCount += 1;
                for (let i = 1; i < tipIds.length; i++) {
                    const isFingerRaised = lmlist[tipIds[i]][2] < lmlist[tipIds[i] - 2][2];
                    if (isFingerRaised) fingerCount += 1;
                }
                return fingerCount;
            }

            function onResults(results) {
                if (!isRunning) return;
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        const lmlist = [];
                        for (let id = 0; id < 21; id++) {
                            const lm = landmarks[id];
                            let x = lm.x * canvasElement.width;
                            let y = lm.y * canvasElement.height;
                            lmlist.push([id, Math.round(x), Math.round(y)]);
                        }

                        if (lmlist.length === 21) {
                            const fingerCount = countFingers(lmlist);
                            fingerCountDisplay.innerText = `Fingers Raised: ${fingerCount}`;
                            if (window.parent && window.parent !== window) {
                                try {
                                    window.parent.postMessage({
                                        action: 'vision_result',
                                        type: 'finger_tracking',
                                        module: 'block-finger-tracking',
                                        fingerCount: fingerCount,
                                        value: fingerCount
                                    }, '*');
                                } catch (e) { }
                            }
                        }

                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 5 });
                        drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 2 });
                    }
                }
                canvasCtx.restore();
            }

            async function stopCameraStreams() {
                if (camera) { try { await camera.stop(); } catch (e) { } camera = null; }
                forceReleaseCamera(videoElement);
                if (esp32AnimId) { cancelAnimationFrame(esp32AnimId); esp32AnimId = null; }
                if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                isProcessing = false;
            }

            function setupHands() {
                if (!hands) {
                    hands = new Hands({ locateFile: (file) => `${file}` });
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 0,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.5
                    });
                    hands.onResults(onResults);
                }
            }

            function startEsp32Feed() {
                if (!isRunning || window.globalCamModeIndex !== 2) return;
                esp32Img = createEsp32ImgSource(globalEsp32Url);
                document.body.appendChild(esp32Img);
                setupHands();

                function esp32Loop() {
                    if (!isRunning || window.globalCamModeIndex !== 2) return;
                    if (esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) {
                        if (hands && !isProcessing) {
                            isProcessing = true;
                            offscreenCtx.drawImage(esp32Img, 0, 0, 480, 360);
                            hands.send({ image: offscreenCanvas }).catch(() => { }).finally(() => { isProcessing = false; });
                        }
                    }
                    esp32AnimId = requestAnimationFrame(esp32Loop);
                }
                esp32AnimId = requestAnimationFrame(esp32Loop);
            }

            async function startCamera() {
                const session = ++ftCameraSession;
                await stopCameraStreams();
                await new Promise(res => setTimeout(res, 200));

        // MODULE 2: GESTURE CLASSIFIER CONTROLLER
        const GestureClassifierModule = (() => {
            const knn = new LandmarkKNNClassifier(5);

            function setCanvasDimensions() {
                canvasElement.width = 480;
                canvasElement.height = 360;
                updateCanvasTransform(canvasElement);
            }

            function extractFeatures(landmarks) {
                let wrist = landmarks[0];
                let features = [];
                let maxDist = 0;
                for (let i = 1; i < landmarks.length; i++) {
                    let dx = landmarks[i].x - wrist.x;
                    let dy = landmarks[i].y - wrist.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxDist) maxDist = dist;
                }
                for (let i = 0; i < landmarks.length; i++) {
                    let dx = landmarks[i].x - wrist.x;
                    let dy = landmarks[i].y - wrist.y;
                    if (maxDist > 0) {
                        features.push(dx / maxDist);
                        features.push(dy / maxDist);
                    } else {
                        features.push(dx);
                        features.push(dy);
                    }
                }
                return features;
            }

            let fixedAutoTrainTarget = null;
            let fixedAutoTrainCount = 0;
            let lastSelectedLabel = 1;

            function trainFixed(label, count = 20) {
                recordingLabel = parseInt(label, 10) || 1;

                if (!isRunning) return;

                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        let features = extractFeatures(landmarks);
                        if (recordingLabel !== null) {
                            knn.addExample(features, recordingLabel);
                            if (fixedAutoTrainTarget !== null) {
                                fixedAutoTrainCount++;
                                gcStatusDisplay.innerText = `Training Gesture ${recordingLabel}: ${fixedAutoTrainCount}/${fixedAutoTrainTarget} samples...`;
                                gcStatusDisplay.style.color = "#eab308";

                                    gcStatusDisplay.innerText = `Finished! Gesture ${recordingLabel} trained (${fixedAutoTrainTarget} samples).`;

            let lastSelectedClass = 1;
            async function trainFixed(classId, count = 20) {

                async function loop(ts) {
                    if (!isRunning) return;

                    let isSourceReady = false;
                    const imgSource = window.globalCamModeIndex === 2 ? esp32Img : video;

                    if (window.globalCamModeIndex === 2) {

                    } else {

                    if (ts - lastRun < INTERVAL || !isSourceReady || isPredicting) {

                    lastRun = ts;

                    if (isTraining && currentTrainClass) {
                        if (!net || !imgSource) { animId = requestAnimationFrame(loop); return; }

                        btnAction.style.display = 'block';
                        appState = 1;

                        if (isRunning && !animId) renderLoop();
                    };
                } catch (err) {
                    console.error('RGB cam error:', err);
                }
            }

            function handleAction() {
                if (appState === 1) {
                    captureTargetProfile();
                    appState = 2;
                    btnAction.innerText = 'Reset target';
                    btnAction.style.background = '#475569';
                } else if (appState === 2) {
                    appState = 1;
                    btnAction.innerText = 'Capture target';
                    btnAction.style.background = '#10b981';

                    uiPosX.innerText = '-'; uiPosY.innerText = '-'; uiBlobSize.innerText = '-';
                    colorPreview.style.background = '#000';
                    lastGridNum = null;
                }
            }

            function captureTargetProfile() {
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete) ? esp32Img : video;
                ctxOutput.drawImage(src, 0, 0, outputCanvas.width, outputCanvas.height);
                const cx = outputCanvas.width / 2, cy = outputCanvas.height / 2, box = 40;
                const imgData = ctxOutput.getImageData(cx - box / 2, cy - box / 2, box, box).data;

                let sats = [], vals = [], sumSin = 0, sumCos = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    const hsv = rgbToHsv(imgData[i], imgData[i + 1], imgData[i + 2]);
                    sats.push(hsv.s); vals.push(hsv.v);
                    let rad = hsv.h * Math.PI / 180;
                    sumSin += Math.sin(rad); sumCos += Math.cos(rad);
                }
                const getMed = (arr) => { arr.sort((a, b) => a - b); const m = Math.floor(arr.length / 2); return arr.length % 2 !== 0 ? arr[m] : (arr[m - 1] + arr[m]) / 2; };

                targetProfile.h = (Math.atan2(sumSin, sumCos) * 180 / Math.PI + 360) % 360;
                targetProfile.s = getMed(sats);
                targetProfile.v = getMed(vals);

                const ratioX = PROC_WIDTH / outputCanvas.width;
                const ratioY = PROC_HEIGHT / outputCanvas.height;
                targetProfile.size = (box * ratioX) * (box * ratioY) * 0.8;
                targetProfile.whRatio = 1.0;

                tracker.x = PROC_WIDTH / 2;
                tracker.y = PROC_HEIGHT / 2;
                tracker.vx = 0; tracker.vy = 0;
                tracker.framesDetected = 0; tracker.framesLost = 0;
                tracker.isLocked = false;
                tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];

                const rgb = hsvToRgb(targetProfile.h, targetProfile.s, targetProfile.v);
                colorPreview.style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
            }

            function findAllBlobs(binaryMask, minX, minY, maxX, maxY) {
                const visited = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);
                const blobs = [];
                const q = new Uint32Array(PROC_WIDTH * PROC_HEIGHT);

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        const idx = y * PROC_WIDTH + x;
                        if (binaryMask[idx] === 1 && visited[idx] === 0) {
                            let head = 0, tail = 0;
                            q[tail++] = idx;
                            visited[idx] = 1;

                            let bx1 = x, bx2 = x, by1 = y, by2 = y, size = 0;
                            let sumX = 0, sumY = 0;

                            while (head < tail) {
                                const curr = q[head++];
                                const cx = curr % PROC_WIDTH, cy = Math.floor(curr / PROC_WIDTH);

                                bx1 = Math.min(bx1, cx); bx2 = Math.max(bx2, cx);
                                by1 = Math.min(by1, cy); by2 = Math.max(by2, cy);
                                sumX += cx; sumY += cy;
                                size++;

                                if (cy > minY) { const n = curr - PROC_WIDTH; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cy < maxY - 1) { const n = curr + PROC_WIDTH; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cx > minX) { const n = curr - 1; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cx < maxX - 1) { const n = curr + 1; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                            }

                            if (size >= MIN_BLOB_SIZE) {
                                let w = bx2 - bx1 + 1;
                                let h = by2 - by1 + 1;
                                blobs.push({
                                    x: bx1, y: by1, w: w, h: h, size: size,
                                    cx: sumX / size, cy: sumY / size,
                                    ratio: w / h
                                });
                            }
                        }
                    }
                }
                return blobs;
            }

            function scoreBlobArray(blobs, predX, predY) {
                let bestBlob = null;
                let highestScore = -1;

                for (let b of blobs) {
                    let sizeRatio = b.size / targetProfile.size;
                    let sizeScore = sizeRatio > 1 ? (1 / sizeRatio) : sizeRatio;
                    let ratioDiff = Math.abs(b.ratio - targetProfile.whRatio);
                    let shapeScore = Math.max(0, 1 - ratioDiff);
                    let dx = b.cx - predX;
                    let dy = b.cy - predY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let distScore = Math.max(0, 1 - (dist / (PROC_WIDTH * 0.3)));
                    let score = (0.4 * sizeScore) + (0.2 * shapeScore) + (0.4 * distScore);

                    if (score > highestScore) {
                        highestScore = score;
                        bestBlob = b;
                    }
                }
                return { bestBlob, highestScore };
            }

            function executeTracker() {
                let minX = tracker.roi[0], minY = tracker.roi[1];
                let maxX = tracker.roi[2], maxY = tracker.roi[3];
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) ? esp32Img : video;
                ctxProc.drawImage(src, 0, 0, PROC_WIDTH, PROC_HEIGHT);
                const data = ctxProc.getImageData(0, 0, PROC_WIDTH, PROC_HEIGHT).data;
                const mask = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        let i = (y * PROC_WIDTH + x) * 4;
                        const hsv = rgbToHsv(data[i], data[i + 1], data[i + 2]);
                        if (Math.abs(hsv.s - targetProfile.s) <= THRESH_SAT &&
                            Math.abs(hsv.v - targetProfile.v) <= THRESH_VAL &&
                            hueDist(hsv.h, targetProfile.h) <= THRESH_HUE) {
                            mask[y * PROC_WIDTH + x] = 1;
                        }
                    }
                }

                const blobs = findAllBlobs(mask, minX, minY, maxX, maxY);
                let predX = tracker.x + tracker.vx;
                let predY = tracker.y + tracker.vy;
                const { bestBlob, highestScore } = scoreBlobArray(blobs, predX, predY);

                if (bestBlob && highestScore > 0.1) {
                    tracker.framesLost = 0;
                    tracker.framesDetected++;
                    if (tracker.framesDetected >= 2) tracker.isLocked = true;

                    let measurementX = bestBlob.cx;
                    let measurementY = bestBlob.cy;
                    tracker.x = predX + ALPHA * (measurementX - predX);
                    tracker.y = predY + ALPHA * (measurementY - predY);
                    tracker.vx = tracker.vx + BETA * (measurementX - predX);
                    tracker.vy = tracker.vy + BETA * (measurementY - predY);

                    targetProfile.size = (0.8 * targetProfile.size) + (0.2 * bestBlob.size);
                    targetProfile.whRatio = (0.8 * targetProfile.whRatio) + (0.2 * bestBlob.ratio);
                } else {
                    tracker.framesDetected = 0;
                    tracker.framesLost++;
                    if (tracker.framesLost >= 10) tracker.isLocked = false;
                    tracker.x = predX;
                    tracker.y = predY;
                    tracker.vx *= 0.8;
                    tracker.vy *= 0.8;
                }

                if (tracker.isLocked) {
                    let padding = 30;
                    tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                    tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                    tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                    tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
                } else {
                    if (tracker.framesLost < 20) {
                        let padding = 50 + (tracker.framesLost * 2);
                        tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                        tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                        tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                        tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
                    } else {
                        tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];
                    }
                }

                return { x: tracker.x, y: tracker.y, blob: bestBlob, isLocked: tracker.isLocked };
            }

            function renderLoop() {
                if (!isRunning) return;
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) ? esp32Img : video;
                if (window.globalCamModeIndex === 2 && (!esp32Img || !esp32Img.complete || !esp32Img.naturalWidth)) {
                    animId = requestAnimationFrame(renderLoop);
                    return;
                }
                ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                ctxOutput.drawImage(src, 0, 0, outputCanvas.width, outputCanvas.height);

                if (cfg.hasGrid) {
                    const cellW = outputCanvas.width / 3;
                    const cellH = outputCanvas.height / 3;
                    ctxOutput.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctxOutput.lineWidth = 1;
                    ctxOutput.beginPath();
                    ctxOutput.moveTo(cellW, 0); ctxOutput.lineTo(cellW, outputCanvas.height);
                    ctxOutput.moveTo(cellW * 2, 0); ctxOutput.lineTo(cellW * 2, outputCanvas.height);
                    ctxOutput.moveTo(0, cellH); ctxOutput.lineTo(outputCanvas.width, cellH);
                    ctxOutput.moveTo(0, cellH * 2); ctxOutput.lineTo(outputCanvas.width, cellH * 2);
                    ctxOutput.stroke();
                }

                if (appState === 1) {
                    const cx = outputCanvas.width / 2, cy = outputCanvas.height / 2, box = 40;
                    ctxOutput.strokeStyle = '#00ff66';
                    ctxOutput.lineWidth = 2;
                    ctxOutput.setLineDash([5, 5]);
                    ctxOutput.strokeRect(cx - box / 2, cy - box / 2, box, box);
                    ctxOutput.setLineDash([]);
                    ctxOutput.beginPath();
                    ctxOutput.moveTo(cx - 10, cy); ctxOutput.lineTo(cx + 10, cy);
                    ctxOutput.moveTo(cx, cy - 10); ctxOutput.lineTo(cx, cy + 10);
                    ctxOutput.stroke();
                }

                if (appState === 2) {
                    if (window.globalCamModeIndex === 2 && esp32Img) {
                        try { ctxProc.drawImage(esp32Img, 0, 0, PROC_WIDTH, PROC_HEIGHT); } catch (e) { }
                    }
                    const res = executeTracker();
                    const scaleX = outputCanvas.width / PROC_WIDTH;
                    const scaleY = outputCanvas.height / PROC_HEIGHT;

                    if (res.isLocked || tracker.framesLost < 20) {
                        const rx = tracker.roi[0] * scaleX, ry = tracker.roi[1] * scaleY;
                        const rw = (tracker.roi[2] - tracker.roi[0]) * scaleX;
                        const rh = (tracker.roi[3] - tracker.roi[1]) * scaleY;
                        ctxOutput.strokeStyle = 'rgba(255,255,255,0.2)';
                        ctxOutput.lineWidth = 1;
                        ctxOutput.setLineDash([5, 5]);
                        ctxOutput.strokeRect(rx, ry, rw, rh);
                        ctxOutput.setLineDash([]);
                    }

                    if (res.blob && tracker.isLocked) {
                        const drawCX = res.x * scaleX;
                        const drawCY = res.y * scaleY;
                        const drawW = res.blob.w * scaleX;
                        const drawH = res.blob.h * scaleY;

                        ctxOutput.strokeStyle = '#0f0';
                        ctxOutput.lineWidth = 2;
                        ctxOutput.strokeRect(drawCX - drawW / 2, drawCY - drawH / 2, drawW, drawH);

                        ctxOutput.beginPath();
                        ctxOutput.arc(drawCX, drawCY, 4, 0, 2 * Math.PI);
                        ctxOutput.fillStyle = '#f00';
                        ctxOutput.fill();

                        ctxOutput.beginPath();
                        ctxOutput.moveTo(drawCX, drawCY);
                        ctxOutput.lineTo(drawCX + (tracker.vx * scaleX * 3), drawCY + (tracker.vy * scaleY * 3));
                        ctxOutput.strokeStyle = '#ff0';
                        ctxOutput.lineWidth = 2;
                        ctxOutput.stroke();

                        const displayX = Math.round(outputCanvas.width - drawCX);
                        uiPosX.innerText = displayX;
                        uiPosY.innerText = Math.round(drawCY);
                        uiBlobSize.innerText = Math.round(res.blob.size);

                        if (cfg.logCoords) {
                            console.log(`X: ${displayX}, Y: ${Math.round(drawCY)}`);
                        }

                        if (cfg.hasGrid) {
                            let col = Math.floor(displayX / (outputCanvas.width / 3));
                            let row = Math.floor(drawCY / (outputCanvas.height / 3));
                            col = Math.max(0, Math.min(2, col));
                            row = Math.max(0, Math.min(2, row));
                            let currentGridNum = row * 3 + col + 1;
                            if (currentGridNum !== lastGridNum) {
                                console.log(currentGridNum);
                                lastGridNum = currentGridNum;
                            }
                        }

                        if (window.parent && window.parent !== window) {
                            try {
                                window.parent.postMessage({
                                    action: 'vision_result',
                                    type: 'rgb_tracker',
                                    trackerId: cfg.btnActionId,
                                    x: displayX,
                                    y: Math.round(drawCY),
                                    blobSize: Math.round(res.blob.size),
                                    grid: cfg.hasGrid ? (lastGridNum || null) : null
                                }, '*');
                            } catch (e) { }
                        }
                    }
                }

                animId = requestAnimationFrame(renderLoop);
            }

            btnAction.addEventListener('click', handleAction);

            return {
                start: () => {
                    isRunning = true;
                    window._activeVisionModule = {
                        isEsp32Mode: () => window.globalCamModeIndex === 2,
                        restartEsp32: () => {
                            if (animId) { cancelAnimationFrame(animId); animId = null; }
                            stopRgbCameraStreams();
                            appState = 0;
                            startCamera();
                        },
                        restartCamera: () => {
                            if (animId) { cancelAnimationFrame(animId); animId = null; }
                            stopRgbCameraStreams();
                            appState = 0;
                            startCamera();
                        }
                    };
                    startCamera();
                },
                stop: async () => {
                    isRunning = false;
                    if (animId) cancelAnimationFrame(animId);
                    await stopRgbCameraStreams();
                    ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                }
            };
        }

        const RGBCoordinatesModule = createRGBTrackerModule({
            videoId: 'rgb-coord-video',
            outputCanvasId: 'rgb-coord-output',
            procCanvasId: 'rgb-coord-proc',
            btnActionId: 'rgb-coord-action-btn',
            posXId: 'rgb-coord-pos-x',
            posYId: 'rgb-coord-pos-y',
            blobSizeId: 'rgb-coord-blob-size',
            previewId: 'rgb-coord-preview',
            logCoords: true,
            hasGrid: false
        });

        const RGBColorPickerModule = createRGBTrackerModule({
            videoId: 'rgb-color-video',
            outputCanvasId: 'rgb-color-output',
            procCanvasId: 'rgb-color-proc',
            btnActionId: 'rgb-color-action-btn',
            posXId: 'rgb-color-pos-x',
            posYId: 'rgb-color-pos-y',
            blobSizeId: 'rgb-color-blob-size',
            previewId: 'rgb-color-preview',
            logCoords: false,
            hasGrid: false
        });

        const RGBGridModule = createRGBTrackerModule({
            videoId: 'rgb-grid-video',
            outputCanvasId: 'rgb-grid-output',
            procCanvasId: 'rgb-grid-proc',
            btnActionId: 'rgb-grid-action-btn',
            posXId: 'rgb-grid-pos-x',
            posYId: 'rgb-grid-pos-y',
            blobSizeId: 'rgb-grid-blob-size',
            previewId: 'rgb-grid-preview',
            logCoords: false,
            hasGrid: true
        });

        const modules = {
            'block-finger-tracking': FingerTrackingModule,
            'block-gesture-classifier': GestureClassifierModule,
            'block-image-classifier': ImageClassifierModule,
            'block-rgb-coords': RGBCoordinatesModule,
            'block-rgb-colorpicker': RGBColorPickerModule,
            'block-rgb-grid': RGBGridModule
        };

        let currentActiveBlockId = 'block-finger-tracking';

        async function switchModule(targetBlockId) {
            if (currentActiveBlockId && modules[currentActiveBlockId]) {
                try {
                    await modules[currentActiveBlockId].stop();
                } catch (e) {
                    console.warn(`Error stopping ${currentActiveBlockId}:`, e);
                }
            }

            document.querySelectorAll('.app-block').forEach(b => b.classList.remove('active'));

            const targetBlock = document.getElementById(targetBlockId);
            if (targetBlock) targetBlock.classList.add('active');

            currentActiveBlockId = targetBlockId;

            if (modules[targetBlockId]) {
                try {
                    await modules[targetBlockId].start();
                } catch (e) {
                    console.error(`Error starting ${targetBlockId}:`, e);
                }
            }

            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        action: 'vision_module_changed',
                        activeModule: currentActiveBlockId
                    }, '*');
                } catch (e) { }
            }
        }

        window.addEventListener('load', () => {
            if (modules[currentActiveBlockId]) {
                modules[currentActiveBlockId].start();
            }
            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        action: 'vision_ready',
                        activeModule: currentActiveBlockId
                    }, '*');
                } catch (e) { }
            }
        });

        window.clearClassifiers = function () {
            const gcBtn = document.getElementById('gc-clearDataBtn');
            if (gcBtn) gcBtn.click();
            const icBtn = document.getElementById('ic-clear-btn');
            if (icBtn) icBtn.click();
            console.log("Classifier memory cleared via clearClassifiers().");
        };

        window.trainClassifier = async function (type, buttonId = 1, count = 20) {
            const classNum = parseInt(buttonId, 10) || 1;
            if (type === 'gesture') {
                switchModule('block-gesture-classifier');
                if (GestureClassifierModule && GestureClassifierModule.trainFixed) {
                    GestureClassifierModule.trainFixed(classNum, count);
                }
            } else {
                switchModule('block-image-classifier');
                if (ImageClassifierModule && ImageClassifierModule.trainFixed) {
                    await ImageClassifierModule.trainFixed(classNum, count);
                }
            }
            console.log(`Auto-trained ${type} classifier for Button ${classNum} (${count} images).`);
        };

        window.addEventListener('message', (event) => {
            if (event.data === 'clear_classifiers' || (event.data && event.data.action === 'clear_classifiers')) {
                window.clearClassifiers();
            } else if (event.data === 'switch_cam' || event.data === 'cycle_cam' || (event.data && (event.data.action === 'switch_cam' || event.data.action === 'cycle_cam'))) {
                cycleCameraMode();
            } else if (event.data && (event.data.action === 'train_classifier' || event.data.type === 'train_classifier')) {
                const target = event.data.classifier || 'image';
                const button = event.data.button || event.data.classId || 1;
                const count = event.data.count || 20;
                window.trainClassifier(target, button, count);
            } else if (event.data === 'pause' || (event.data && event.data.action === 'pause')) {
                if (currentActiveBlockId && modules[currentActiveBlockId]) {
                    try { modules[currentActiveBlockId].stop(); } catch (e) { }
                }
            } else if (event.data === 'resume' || (event.data && event.data.action === 'resume')) {
                if (currentActiveBlockId && modules[currentActiveBlockId]) {
                    try { modules[currentActiveBlockId].start(); } catch (e) { }
                }
            } else if (event.data && (event.data.action === 'switch_module' || event.data.action === 'switch_div' || event.data.type === 'switch_module')) {
                const targetMod = event.data.module || event.data.div || event.data.targetBlockId || event.data.target;
                if (targetMod && typeof switchModule === 'function') {
                    switchModule(targetMod);
                }
            } else if (typeof event.data === 'string' && event.data.startsWith('block-')) {
                if (typeof switchModule === 'function') {
                    switchModule(event.data);
                }
            }
        });
    </script>
</body>
