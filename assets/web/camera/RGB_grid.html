<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Object Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background: #000; color: #ccc; display: flex; flex-direction: column; 
            height: 100vh; font-family: sans-serif; overflow: hidden; 
        }
        
        #camera-container {
            flex: 1; position: relative; background: #111;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }

        .target-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; border: 2px solid #0f0; display: none; pointer-events: none;
        }
        .target-box::after {
            content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 20px;
        }

        .ui-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #222; gap: 10px;
        }

        .controls { display: flex; gap: 8px; }

        button {
            padding: 8px 14px; background: #0a0; color: #fff; border: none;
            border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #080; }
        #btn-action { display: none; }

        .stats {
            display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: monospace;
        }
        .stat-item { min-width: 40px; }
        
        .color-preview { width: 16px; height: 16px; border: 1px solid #fff; background: #000; }
        
        #status-indicator {
            position: absolute; top: 10px; left: 10px; padding: 4px 8px;
            background: rgba(0,0,0,0.5); color: #fff; border-radius: 4px;
            font-size: 12px; font-family: monospace; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="camera-container">
        <div id="status-indicator">STANDBY</div>
        <button id="switch-cam-btn" style="position:absolute;top:10px;right:10px;z-index:100;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.8);border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.3);display:flex;justify-content:center;align-items:center;">📷</button>
        <video id="video" playsinline autoplay></video>
        <canvas id="output-canvas"></canvas>
        <canvas id="processing-canvas" style="display:none;"></canvas>
        <div class="target-box" id="target-box"></div>
    </div>

    <div class="ui-bar">
        <div class="controls">
            <button id="btn-action" onclick="handleAction()">Capture target</button>
        </div>
        <div class="stats">
            <div class="stat-item">X: <span id="pos-x">-</span></div>
            <div class="stat-item">Y: <span id="pos-y">-</span></div>
            <div class="stat-item">S: <span id="blob-size">-</span></div>
            <div class="color-preview" id="color-preview"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const outputCanvas = document.getElementById('output-canvas');
        const ctxOutput = outputCanvas.getContext('2d');
        const procCanvas = document.getElementById('processing-canvas');
        const ctxProc = procCanvas.getContext('2d', { willReadFrequently: true });
        
        const targetBox = document.getElementById('target-box');
        const btnAction = document.getElementById('btn-action');
        const statusInd = document.getElementById('status-indicator');
        const uiPosX = document.getElementById('pos-x');
        const uiPosY = document.getElementById('pos-y');
        const uiBlobSize = document.getElementById('blob-size');
        const colorPreview = document.getElementById('color-preview');

        // Processing Resolution (lower is faster)
        const PROC_WIDTH = 160;
        const PROC_HEIGHT = 120;
        procCanvas.width = PROC_WIDTH;
        procCanvas.height = PROC_HEIGHT;

        let appState = 0; // 0=Init, 1=Select, 2=Track
        let lastGridNum = 0;
        let currentFacingMode = 'user';
        let loopRunning = false;
        
        document.getElementById('switch-cam-btn').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if(video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            startCamera();
        });

        // Thresholds
        const THRESH_HUE = 15; 
        const THRESH_SAT = 0.35;
        const THRESH_VAL = 0.40;
        const MIN_BLOB_SIZE = 5; 

        // TARGET PROFILE (Identification Phase)
        let targetProfile = {
            h: 0, s: 0, v: 0,
            size: 0,
            whRatio: 1.0  // width / height
        };

        // TRACKER STATE (Tracking Phase)
        let tracker = {
            x: PROC_WIDTH/2, y: PROC_HEIGHT/2, // Smoothed Position
            vx: 0, vy: 0,                      // Velocity
            
            framesDetected: 0,
            framesLost: 0,
            isLocked: false,
            
            // Region of Interest [minX, minY, maxX, maxY]
            roi: [0, 0, PROC_WIDTH, PROC_HEIGHT]
        };

        // Simple Alpha-Beta Filter (simplified Kalman for constant velocity)
        const ALPHA = 0.6; // Position responsiveness (0-1)
        const BETA = 0.3;  // Velocity responsiveness (0-1)

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    outputCanvas.width = video.videoWidth;
                    outputCanvas.height = video.videoHeight;
                    video.play();
                    
                    btnAction.style.display = 'block';
                    
                    appState = 1;
                    targetBox.style.display = 'block';
                    statusInd.innerText = "SELECT TARGET";
                    statusInd.style.background = "rgba(0,0,0,0.5)";
                    
                    if (!loopRunning) {
                        loopRunning = true;
                        renderLoop();
                    }
                };
            } catch (err) {
                alert("Camera error: " + err);
            }
        }

        function handleAction() {
            if (appState === 1) {
                captureTargetProfile();
                appState = 2; // Track
                targetBox.style.display = 'none';
                btnAction.innerText = 'Reset target';
                btnAction.style.background = '#444';
            } else if (appState === 2) {
                appState = 1; // Select
                targetBox.style.display = 'block';
                btnAction.innerText = 'Capture target';
                btnAction.style.background = '#0a0';
                
                uiPosX.innerText = '-'; uiPosY.innerText = '-'; uiBlobSize.innerText = '-';
                colorPreview.style.background = '#000';
                statusInd.innerText = "SELECT TARGET";
                statusInd.style.background = "rgba(0,0,0,0.5)";
            }
        }

        // --- Color Utilities ---
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = max, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) h = 0; 
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s, v: v };
        }
        function hsvToRgb(h, s, v) {
            let r, g, b, i = Math.floor(h / 60);
            let f = h / 60 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r=v; g=t; b=p; break;
                case 1: r=q; g=v; b=p; break;
                case 2: r=p; g=v; b=t; break;
                case 3: r=p; g=q; b=v; break;
                case 4: r=t; g=p; b=v; break;
                case 5: r=v; g=p; b=q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }
        function hueDist(h1, h2) {
            let d = Math.abs(h1 - h2);
            return Math.min(d, 360 - d);
        }

        // --- Phase 1: Identification ---
        function captureTargetProfile() {
            ctxOutput.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
            const cx = outputCanvas.width / 2, cy = outputCanvas.height / 2, box = 40;
            const imgData = ctxOutput.getImageData(cx - box/2, cy - box/2, box, box).data;

            let sats = [], vals = [], sumSin = 0, sumCos = 0;
            for (let i = 0; i < imgData.length; i += 4) {
                const hsv = rgbToHsv(imgData[i], imgData[i+1], imgData[i+2]);
                sats.push(hsv.s); vals.push(hsv.v);
                let rad = hsv.h * Math.PI / 180;
                sumSin += Math.sin(rad); sumCos += Math.cos(rad);
            }
            
            const getMed = (arr) => { arr.sort((a, b) => a - b); const m = Math.floor(arr.length/2); return arr.length%2!==0?arr[m]:(arr[m-1]+arr[m])/2; };
            
            targetProfile.h = (Math.atan2(sumSin, sumCos) * 180 / Math.PI + 360) % 360;
            targetProfile.s = getMed(sats);
            targetProfile.v = getMed(vals);
            
            // Initial assumption of size based on target box mapped to proc_resolution
            const ratioX = PROC_WIDTH / outputCanvas.width;
            const ratioY = PROC_HEIGHT / outputCanvas.height;
            targetProfile.size = (box * ratioX) * (box * ratioY) * 0.8; // Approximate inner fill
            targetProfile.whRatio = 1.0; 
            
            // Reset tracker
            tracker.x = PROC_WIDTH / 2;
            tracker.y = PROC_HEIGHT / 2;
            tracker.vx = 0; tracker.vy = 0;
            tracker.framesDetected = 0; tracker.framesLost = 0;
            tracker.isLocked = false;
            tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];
            
            const rgb = hsvToRgb(targetProfile.h, targetProfile.s, targetProfile.v);
            colorPreview.style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
            statusInd.innerText = "INITIALIZING TRACKER...";
        }

        // --- Phase 2: Tracking Subsystems ---
        
        // Find all contiguous blobs in ROI
        function findAllBlobs(binaryMask, minX, minY, maxX, maxY) {
            const visited = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);
            const blobs = [];
            const q = new Uint32Array(PROC_WIDTH * PROC_HEIGHT);
            
            for (let y = minY; y < maxY; y++) {
                for (let x = minX; x < maxX; x++) {
                    const idx = y * PROC_WIDTH + x;
                    if (binaryMask[idx] === 1 && visited[idx] === 0) {
                        let head = 0, tail = 0;
                        q[tail++] = idx;
                        visited[idx] = 1;
                        
                        let bx1 = x, bx2 = x, by1 = y, by2 = y, size = 0;
                        let sumX = 0, sumY = 0;
                        
                        while(head < tail) {
                            const curr = q[head++];
                            const cx = curr % PROC_WIDTH, cy = Math.floor(curr / PROC_WIDTH);
                            
                            bx1 = Math.min(bx1, cx); bx2 = Math.max(bx2, cx);
                            by1 = Math.min(by1, cy); by2 = Math.max(by2, cy);
                            sumX += cx; sumY += cy;
                            size++;
                            
                            if (cy > minY) { const n = curr - PROC_WIDTH; if (binaryMask[n]===1 && !visited[n]) { visited[n]=1; q[tail++]=n; } }
                            if (cy < maxY - 1) { const n = curr + PROC_WIDTH; if (binaryMask[n]===1 && !visited[n]) { visited[n]=1; q[tail++]=n; } }
                            if (cx > minX) { const n = curr - 1; if (binaryMask[n]===1 && !visited[n]) { visited[n]=1; q[tail++]=n; } }
                            if (cx < maxX - 1) { const n = curr + 1; if (binaryMask[n]===1 && !visited[n]) { visited[n]=1; q[tail++]=n; } }
                        }
                        
                        if (size >= MIN_BLOB_SIZE) {
                            let w = bx2 - bx1 + 1;
                            let h = by2 - by1 + 1;
                            blobs.push({
                                x: bx1, y: by1, w: w, h: h, size: size,
                                cx: sumX / size, cy: sumY / size,
                                ratio: w / h
                            });
                        }
                    }
                }
            }
            return blobs;
        }

        // Score multiple candidates
        function scoreBlobArray(blobs, predX, predY) {
            let bestBlob = null;
            let highestScore = -1;
            
            for (let b of blobs) {
                // 1. Size Similarity
                let sizeRatio = b.size / targetProfile.size;
                let sizeScore = sizeRatio > 1 ? (1 / sizeRatio) : sizeRatio;
                
                // 2. Shape (Circularity/Ratio)
                let ratioDiff = Math.abs(b.ratio - targetProfile.whRatio);
                let shapeScore = Math.max(0, 1 - ratioDiff); 
                
                // 3. Distance from Predicted Position
                let dx = b.cx - predX;
                let dy = b.cy - predY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let maxDist = Math.sqrt(PROC_WIDTH*PROC_WIDTH + PROC_HEIGHT*PROC_HEIGHT);
                // Punish distance exponentially
                let distScore = Math.max(0, 1 - (dist / (PROC_WIDTH * 0.3))); 
                
                // Final Score
                let score = (0.4 * sizeScore) + (0.2 * shapeScore) + (0.4 * distScore);
                
                if (score > highestScore) {
                    highestScore = score;
                    bestBlob = b;
                }
            }
            
            return { bestBlob, highestScore };
        }

        // Main Tracking Loop
        function executeTracker() {
            // Adaptive ROI bounds
            let minX = tracker.roi[0], minY = tracker.roi[1];
            let maxX = tracker.roi[2], maxY = tracker.roi[3];
            
            // Image Masking (ONLY within ROI!)
            ctxProc.drawImage(video, 0, 0, PROC_WIDTH, PROC_HEIGHT);
            const data = ctxProc.getImageData(0, 0, PROC_WIDTH, PROC_HEIGHT).data;
            const mask = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);
            
            for (let y = minY; y < maxY; y++) {
                for (let x = minX; x < maxX; x++) {
                    let i = (y * PROC_WIDTH + x) * 4;
                    const hsv = rgbToHsv(data[i], data[i+1], data[i+2]);
                    if (Math.abs(hsv.s - targetProfile.s) <= THRESH_SAT &&
                        Math.abs(hsv.v - targetProfile.v) <= THRESH_VAL &&
                        hueDist(hsv.h, targetProfile.h) <= THRESH_HUE) {
                        mask[y * PROC_WIDTH + x] = 1;
                    }
                }
            }

            // Extract Candidates
            const blobs = findAllBlobs(mask, minX, minY, maxX, maxY);
            
            // Motion Prediction (where we expect it to be this frame)
            let predX = tracker.x + tracker.vx;
            let predY = tracker.y + tracker.vy;

            // Score and select best
            const { bestBlob, highestScore } = scoreBlobArray(blobs, predX, predY);
            
            // Temporal Consistency & Filtering
            if (bestBlob && highestScore > 0.1) {
                // Detected
                tracker.framesLost = 0;
                tracker.framesDetected++;
                
                if (tracker.framesDetected >= 2) tracker.isLocked = true;

                // Alpha-Beta Smoother (Simplified Kalman)
                let measurementX = bestBlob.cx;
                let measurementY = bestBlob.cy;
                
                // Update position
                tracker.x = predX + ALPHA * (measurementX - predX);
                tracker.y = predY + ALPHA * (measurementY - predY);
                // Update velocity
                tracker.vx = tracker.vx + BETA * (measurementX - predX);
                tracker.vy = tracker.vy + BETA * (measurementY - predY);
                
                // Track Scale (gradual adaptation)
                targetProfile.size = (0.8 * targetProfile.size) + (0.2 * bestBlob.size);
                targetProfile.whRatio = (0.8 * targetProfile.whRatio) + (0.2 * bestBlob.ratio);

            } else {
                // Target Lost
                tracker.framesDetected = 0;
                tracker.framesLost++;
                
                if (tracker.framesLost >= 10) tracker.isLocked = false;
                
                // Coasting (continue moving at last known velocity)
                tracker.x = predX;
                tracker.y = predY;
                
                // Friction (slow down predicted velocity gradually)
                tracker.vx *= 0.8;
                tracker.vy *= 0.8;
            }

            // ROI Management
            if (tracker.isLocked) {
                statusInd.innerText = "LOCKED";
                statusInd.style.background = "rgba(16, 185, 129, 0.8)"; // Green
                // Small box around predicted position
                let padding = 30; // pixels
                tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
            } else {
                if (tracker.framesLost < 20) {
                    statusInd.innerText = "RECOVERING...";
                    statusInd.style.background = "rgba(245, 158, 11, 0.8)"; // Orange
                    // Expand search area based on coasting prediction plus uncertainty
                    let padding = 50 + (tracker.framesLost * 2);
                    tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                    tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                    tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                    tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
                } else {
                    statusInd.innerText = "LOST";
                    statusInd.style.background = "rgba(239, 68, 68, 0.8)"; // Red
                    // Full frame search
                    tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];
                }
            }

            return { x: tracker.x, y: tracker.y, blob: bestBlob, isLocked: tracker.isLocked };
        }

        function renderLoop() {
            ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
            ctxOutput.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
            
            // Draw 3x3 Grid
            const cellW = outputCanvas.width / 3;
            const cellH = outputCanvas.height / 3;
            ctxOutput.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctxOutput.lineWidth = 1;
            ctxOutput.beginPath();
            ctxOutput.moveTo(cellW, 0); ctxOutput.lineTo(cellW, outputCanvas.height);
            ctxOutput.moveTo(cellW * 2, 0); ctxOutput.lineTo(cellW * 2, outputCanvas.height);
            ctxOutput.moveTo(0, cellH); ctxOutput.lineTo(outputCanvas.width, cellH);
            ctxOutput.moveTo(0, cellH * 2); ctxOutput.lineTo(outputCanvas.width, cellH * 2);
            ctxOutput.stroke();

            if (appState === 2) {
                const res = executeTracker();
                
                const scaleX = outputCanvas.width / PROC_WIDTH;
                const scaleY = outputCanvas.height / PROC_HEIGHT;

                // Draw ROI Box for debugging/viz
                if (res.isLocked || tracker.framesLost < 20) {
                    const rx = tracker.roi[0] * scaleX, ry = tracker.roi[1] * scaleY;
                    const rw = (tracker.roi[2] - tracker.roi[0]) * scaleX;
                    const rh = (tracker.roi[3] - tracker.roi[1]) * scaleY;
                    ctxOutput.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctxOutput.lineWidth = 1;
                    ctxOutput.setLineDash([5, 5]);
                    ctxOutput.strokeRect(rx, ry, rw, rh);
                    ctxOutput.setLineDash([]);
                }
                
                if (res.blob && tracker.isLocked) {
                    const drawCX = res.x * scaleX;
                    const drawCY = res.y * scaleY;
                    const drawW = res.blob.w * scaleX;
                    const drawH = res.blob.h * scaleY;
                    
                    // Box around the smoothed location using the current expected scale
                    ctxOutput.strokeStyle = '#0f0';
                    ctxOutput.lineWidth = 2;
                    ctxOutput.strokeRect(drawCX - drawW/2, drawCY - drawH/2, drawW, drawH);
                    
                    // Smoothed Centroid
                    ctxOutput.beginPath();
                    ctxOutput.arc(drawCX, drawCY, 4, 0, 2 * Math.PI);
                    ctxOutput.fillStyle = '#f00';
                    ctxOutput.fill();
                    
                    // Velocity Vector Line
                    ctxOutput.beginPath();
                    ctxOutput.moveTo(drawCX, drawCY);
                    ctxOutput.lineTo(drawCX + (tracker.vx * scaleX * 3), drawCY + (tracker.vy * scaleY * 3));
                    ctxOutput.strokeStyle = '#ff0';
                    ctxOutput.lineWidth = 2;
                    ctxOutput.stroke();
                    
                    // Status Output
                    const displayX = Math.round(outputCanvas.width - drawCX);
                    uiPosX.innerText = displayX;
                    uiPosY.innerText = Math.round(drawCY);
                    uiBlobSize.innerText = Math.round(res.blob.size);
                    
                    // Grid mapping logic
                    let col = Math.floor(displayX / (outputCanvas.width / 3));
                    let row = Math.floor(drawCY / (outputCanvas.height / 3));
                    col = Math.max(0, Math.min(2, col));
                    row = Math.max(0, Math.min(2, row));
                    
                    let currentGridNum = row * 3 + col + 1;
                    if (currentGridNum !== lastGridNum) {
                        console.log(currentGridNum);
                        lastGridNum = currentGridNum;
                    }
                }
            }
            
            requestAnimationFrame(renderLoop);
        }

        // Auto-start the camera when the page loads
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
