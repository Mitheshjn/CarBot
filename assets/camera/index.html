<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vision AI Suite</title>

    <!-- External Local Libraries -->
    <script src="camera_utils.js"></script>
    <script src="control_utils.js"></script>
    <script src="drawing_utils.js"></script>
    <script src="hands.js"></script>
    <script src="tf.min.js"></script>
    <script src="mobilenet.js"></script>
    <script src="knn-classifier.js"></script>

    <style>
        :root {
            --primary-accent: #3b82f6;
            --bg-base: #0f172a;
            --bg-nav: rgba(15, 23, 42, 0.92);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Global Header --- */
        #global-header {
            flex-shrink: 0;
            background: var(--bg-nav);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            gap: 12px;
            z-index: 1000;
            user-select: none;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-brand .dot {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            display: inline-block;
        }

        /* --- Workspace Blocks --- */
        #workspace-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .app-block {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .app-block.active {
            display: flex;
        }

        /* Common Camera Flip Button (Now in Header) */
        .cam-switch-floating {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .cam-switch-floating:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 1);
        }

        .cam-switch-floating.esp32-mode {
            background: rgba(59, 130, 246, 0.9);
            color: #fff;
        }

        /* ESP32 URL Bar */
        #esp32-url-bar {
            flex-shrink: 0;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #0f172a;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
        }

        #esp32-url-bar label {
            color: #60a5fa;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        #esp32-url-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            padding: 5px 10px;
            outline: none;
        }

        #esp32-url-apply {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        #esp32-url-apply:active {
            background: #2563eb;
        }


        /* ========================================================= */
        /* BLOCK 1: FINGER TRACKING                                  */
        /* ========================================================= */
        #block-finger-tracking {
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .ft-video-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ft-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        @media (orientation: landscape) {
            .ft-canvas {
                object-fit: contain;
            }
        }

        #ft-fingerCount {
            padding: 14px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: #111827;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ========================================================= */
        /* BLOCK 2: GESTURE CLASSIFIER                              */
        /* ========================================================= */
        #block-gesture-classifier {
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .gc-video-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gc-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        @media (orientation: landscape) {
            .gc-canvas {
                object-fit: contain;
            }
        }

        #gc-status {
            position: absolute;
            top: 14px;
            left: 0;
            right: 0;
            text-align: center;
            color: #00ff66;
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        /* Reusing Image Classifier Buttons CSS for Gesture Classifier */
        #gc-controls {
            display: flex;
            gap: 10px;
            padding: 14px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: #111827;
            border-top: 1px solid var(--border-color);
            justify-content: center;
        }

        /* ========================================================= */
        /* BLOCK 3: IMAGE CLASSIFIER (TEACHABLE WEBCAM)             */
        /* ========================================================= */
        #block-image-classifier {
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        #block-image-classifier .ic-video-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #block-image-classifier video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        @media (orientation: landscape) {
            #block-image-classifier video {
                object-fit: contain;
            }
        }

        #block-image-classifier #ic-status {
            position: absolute;
            top: 14px;
            left: 0;
            right: 0;
            text-align: center;
            color: #00ff66;
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        #block-image-classifier #ic-controls {
            display: flex;
            gap: 10px;
            padding: 14px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: #111827;
            border-top: 1px solid var(--border-color);
            justify-content: center;
        }

        .ic-train-btn {
            flex: 1;
            max-width: 64px;
            height: 52px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #1f2937;
            color: white;
            font-size: 19px;
            font-weight: bold;
            touch-action: none;
            user-select: none;
            position: relative;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .ic-train-btn:active,
        .ic-train-btn.holding {
            background: var(--theme);
            border-color: var(--theme);
            transform: scale(0.95);
        }

        .ic-train-btn.has-data {
            border-color: var(--theme);
            box-shadow: 0 0 10px var(--theme);
        }

        .ic-train-btn .badge {
            display: none;
            position: absolute;
            top: -8px;
            right: -8px;
            background: white;
            color: black;
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .ic-train-btn.has-data .badge {
            display: block;
        }

        .ic-clear-btn {
            flex: 1;
            max-width: 76px;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #ef4444;
            color: white;
            font-size: 15px;
            font-weight: bold;
            touch-action: none;
            user-select: none;
            cursor: pointer;
            margin-left: 6px;
        }

        .ic-clear-btn:active {
            background: #dc2626;
            transform: scale(0.95);
        }

        /* ========================================================= */
        /* BLOCKS 4, 5, 6: RGB TRACKERS (Coords, ColorPicker, Grid)  */
        /* ========================================================= */
        .rgb-block-wrapper {
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .rgb-cam-area {
            flex: 1;
            position: relative;
            background: #09090b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .rgb-cam-area canvas.rgb-out-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        .rgb-cam-area .target-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 2px solid #00ff66;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .rgb-cam-area .target-crosshair::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff66;
            font-size: 22px;
            font-weight: 300;
        }

        .rgb-status-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: bold;
            z-index: 10;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .rgb-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #111827;
            border-top: 1px solid var(--border-color);
            gap: 12px;
            flex-shrink: 0;
        }

        .rgb-action-btn {
            padding: 9px 18px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }

        .rgb-action-btn:active {
            transform: scale(0.96);
        }

        .rgb-stats-group {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #e2e8f0;
        }

        .rgb-preview-chip {
            width: 22px;
            height: 22px;
            border: 2px solid #fff;
            border-radius: 4px;
            background: #000;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <!-- Global App Header with Global Camera Switcher -->
    <header id="global-header">
        <div class="header-brand">
            <span class="dot"></span>
            <span>Vision Suite</span>
        </div>
        <!-- Unified Camera Flip Switch placed in Header -->
        <button id="global-switch-cam-btn" class="cam-switch-floating" title="Switch Camera">📷</button>
    </header>

    <!-- ESP32 URL Bar (shown when any module is in ESP32 mode) -->
    <div id="esp32-url-bar">
        <label>📡 ESP32:</label>
        <input id="esp32-url-input" type="text" value="http://192.168.4.10:81/stream"
            placeholder="http://192.168.4.10:81/stream" />
        <button id="esp32-url-apply" onclick="applyEsp32Url()">Apply</button>
    </div>

    <!-- Main Workspace Container -->
    <main id="workspace-container">

        <!-- ================================================================= -->
        <!-- 1. FINGER TRACKING BLOCK                                          -->
        <!-- ================================================================= -->
        <div id="block-finger-tracking" class="app-block active">
            <div class="ft-video-container">
                <div style="display: none;"><video id="ft-video" playsinline></video></div>
                <canvas id="ft-output_canvas" class="ft-canvas"></canvas>
            </div>
            <!-- Fingers raised text moved out of canvas and styled cleanly -->
            <div id="ft-fingerCount">Fingers Raised: 0</div>
        </div>

        <!-- ================================================================= -->
        <!-- 2. GESTURE CLASSIFIER BLOCK                                       -->
        <!-- ================================================================= -->
        <div id="block-gesture-classifier" class="app-block">
            <div class="gc-video-container">
                <div style="display: none;"><video id="gc-video" playsinline></video></div>
                <canvas id="gc-output_canvas" class="gc-canvas"></canvas>
                <!-- Central status overlay specific to gesture prediction -->
                <div id="gc-status">Prediction: None</div>
            </div>

            <!-- Identical control bar format as Image Classifier -->
            <div id="gc-controls">
                <button class="ic-train-btn gc-gestureBtn" data-label="1" style="--theme: #ef4444;">1</button>
                <button class="ic-train-btn gc-gestureBtn" data-label="2" style="--theme: #f97316;">2</button>
                <button class="ic-train-btn gc-gestureBtn" data-label="3" style="--theme: #eab308;">3</button>
                <button class="ic-train-btn gc-gestureBtn" data-label="4" style="--theme: #10b981;">4</button>
                <button class="ic-train-btn gc-gestureBtn" data-label="5" style="--theme: #3b82f6;">5</button>
                <button id="gc-autoTrainBtn" class="ic-clear-btn"
                    style="background: #2563eb; font-size: 13px; max-width: 72px;" title="Train fixed 20 images">📸
                    20x</button>
                <button id="gc-clearDataBtn" class="ic-clear-btn">X</button>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- 3. IMAGE CLASSIFIER (TEACHABLE WEBCAM) BLOCK                      -->
        <!-- ================================================================= -->
        <div id="block-image-classifier" class="app-block">
            <div class="ic-video-container">
                <video id="ic-webcam" autoplay playsinline muted></video>
                <div id="ic-status">Loading model...</div>
