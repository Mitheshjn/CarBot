            <div id="ic-controls">
                <button class="ic-train-btn" data-class="1" style="--theme: #ef4444;">1<span
                        class="badge">0</span></button>
                <button class="ic-train-btn" data-class="2" style="--theme: #f97316;">2<span
                        class="badge">0</span></button>
                <button class="ic-train-btn" data-class="3" style="--theme: #eab308;">3<span
                        class="badge">0</span></button>
                <button class="ic-train-btn" data-class="4" style="--theme: #10b981;">4<span
                        class="badge">0</span></button>
                <button class="ic-train-btn" data-class="5" style="--theme: #3b82f6;">5<span
                        class="badge">0</span></button>
                <button class="ic-clear-btn" id="ic-autoTrainBtn"
                    style="background: #2563eb; font-size: 13px; max-width: 72px;" title="Train fixed 20 images">📸
                    20x</button>
                <button class="ic-clear-btn" id="ic-clear-btn">Clear</button>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- 4. RGB COORDINATES TRACKER BLOCK                                  -->
        <!-- ================================================================= -->
        <div id="block-rgb-coords" class="app-block rgb-block-wrapper">
            <div class="rgb-cam-area">
                <div class="rgb-status-tag" id="rgb-coord-status">STANDBY</div>
                <video id="rgb-coord-video" playsinline autoplay style="display:none;"></video>
                <canvas id="rgb-coord-output" class="rgb-out-canvas"></canvas>
                <canvas id="rgb-coord-proc" style="display:none;"></canvas>
                <div class="target-crosshair" id="rgb-coord-box"></div>
            </div>
            <div class="rgb-bottom-bar">
                <div>
                    <button class="rgb-action-btn" id="rgb-coord-action-btn">Capture target</button>
                </div>
                <div class="rgb-stats-group">
                    <div>X: <span id="rgb-coord-pos-x">-</span></div>
                    <div>Y: <span id="rgb-coord-pos-y">-</span></div>
                    <div>S: <span id="rgb-coord-blob-size">-</span></div>
                    <div class="rgb-preview-chip" id="rgb-coord-preview"></div>
                </div>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- 5. RGB COLOR PICKER TRACKER BLOCK                                 -->
        <!-- ================================================================= -->
        <div id="block-rgb-colorpicker" class="app-block rgb-block-wrapper">
            <div class="rgb-cam-area">
                <div class="rgb-status-tag" id="rgb-color-status">STANDBY</div>
                <video id="rgb-color-video" playsinline autoplay style="display:none;"></video>
                <canvas id="rgb-color-output" class="rgb-out-canvas"></canvas>
                <canvas id="rgb-color-proc" style="display:none;"></canvas>
                <div class="target-crosshair" id="rgb-color-box"></div>
            </div>
            <div class="rgb-bottom-bar">
                <div>
                    <button class="rgb-action-btn" id="rgb-color-action-btn">Capture target</button>
                </div>
                <div class="rgb-stats-group">
                    <div>X: <span id="rgb-color-pos-x">-</span></div>
                    <div>Y: <span id="rgb-color-pos-y">-</span></div>
                    <div>S: <span id="rgb-color-blob-size">-</span></div>
                    <div class="rgb-preview-chip" id="rgb-color-preview"></div>
                </div>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- 6. RGB 3x3 GRID TRACKER BLOCK                                     -->
        <!-- ================================================================= -->
        <div id="block-rgb-grid" class="app-block rgb-block-wrapper">
            <div class="rgb-cam-area">
                <div class="rgb-status-tag" id="rgb-grid-status">STANDBY</div>
                <video id="rgb-grid-video" playsinline autoplay style="display:none;"></video>
                <canvas id="rgb-grid-output" class="rgb-out-canvas"></canvas>
                <canvas id="rgb-grid-proc" style="display:none;"></canvas>
                <div class="target-crosshair" id="rgb-grid-box"></div>
            </div>
            <div class="rgb-bottom-bar">
                <div>
                    <button class="rgb-action-btn" id="rgb-grid-action-btn">Capture target</button>
                </div>
                <div class="rgb-stats-group">
                    <div>X: <span id="rgb-grid-pos-x">-</span></div>
                    <div>Y: <span id="rgb-grid-pos-y">-</span></div>
                    <div>S: <span id="rgb-grid-blob-size">-</span></div>
                    <div class="rgb-preview-chip" id="rgb-grid-preview"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Core Combined Scripts & Lifecycle Controller -->
    <script>
        // Suppress Mediapipe glog noise
        function isMediapipeLog(msg) {
            if (typeof msg !== 'string') return false;
            return msg.startsWith('I0000') || msg.startsWith('W0000') || msg.startsWith('E0000') || msg.includes('gl_context');
        }
        const _warn = console.warn;
        console.warn = function (...args) { if (isMediapipeLog(args[0])) return; _warn.apply(console, args); };
        const _log = console.log;
        console.log = function (...args) { if (isMediapipeLog(args[0])) return; _log.apply(console, args); };
        const _err = console.error;
        console.error = function (...args) { if (isMediapipeLog(args[0])) return; _err.apply(console, args); };

        // Offline KNN Classifier class for Landmark Gestures
        class LandmarkKNNClassifier {
            constructor(k = 5) {
                this.k = k;
                this.data = [];
            }
            addExample(features, label) {
                this.data.push({ features, label });
            }
            clear() {
                this.data = [];
            }
            predict(features) {
                if (this.data.length === 0) return null;
                let distances = [];
                for (let i = 0; i < this.data.length; i++) {
                    let dist = 0;
                    for (let j = 0; j < features.length; j++) {
                        dist += Math.pow(features[j] - this.data[i].features[j], 2);
                    }
                    distances.push({ dist: dist, label: this.data[i].label });
                }
                distances.sort((a, b) => a.dist - b.dist);
                let kNearest = distances.slice(0, this.k);
                let counts = {};
                for (let neighbor of kNearest) {
                    counts[neighbor.label] = (counts[neighbor.label] || 0) + 1;
                }
                let maxCount = -1;
                let prediction = null;
                for (let label in counts) {
                    if (counts[label] > maxCount) {
                        maxCount = counts[label];
                        prediction = parseInt(label);
                    }
                }
                return prediction;
            }
        }

        // Shared Color Math Utilities for RGB Tracker Modules
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = max, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) h = 0;
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s, v: v };
        }

        function hsvToRgb(h, s, v) {
            let r, g, b, i = Math.floor(h / 60);
            let f = h / 60 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        function hueDist(h1, h2) {
            let d = Math.abs(h1 - h2);
            return Math.min(d, 360 - d);
        }

        // =================================================================
        // GLOBAL CAMERA & ESP32 STATE
        // =================================================================
        let globalEsp32Url = 'http://192.168.4.10:81/stream';
        let globalEsp32ActiveModules = new Set();

        // 0=front, 1=back, 2=esp32
        window.globalCamModeIndex = 0;
        const CAM_MODES = ['user', 'environment', 'esp32'];
        const CAM_ICONS = ['📷', '🔄', '📡'];

        window.addEventListener('DOMContentLoaded', () => {
            const globalCamBtn = document.getElementById('global-switch-cam-btn');
            if (globalCamBtn) {
                globalCamBtn.addEventListener('click', () => {
                    window.globalCamModeIndex = (window.globalCamModeIndex + 1) % 3;
                    globalCamBtn.textContent = CAM_ICONS[window.globalCamModeIndex];
                    globalCamBtn.classList.toggle('esp32-mode', window.globalCamModeIndex === 2);

                    if (window._activeVisionModule && window._activeVisionModule.restartCamera) {
                        window._activeVisionModule.restartCamera();
                    } else if (window._activeVisionModule && window._activeVisionModule.restartEsp32) {
                        window._activeVisionModule.restartEsp32();
                    }
                });
            }
        });

        function applyEsp32Url() {
            const input = document.getElementById('esp32-url-input');
            if (input && input.value.trim()) {
                globalEsp32Url = input.value.trim();
            }
            if (window._activeVisionModule && window._activeVisionModule.isEsp32Mode && window._activeVisionModule.isEsp32Mode()) {
                window._activeVisionModule.restartEsp32();
            }
        }
        window.applyEsp32Url = applyEsp32Url;

        function updateEsp32Bar() {
            const bar = document.getElementById('esp32-url-bar');
            if (!bar) return;
            if (globalEsp32ActiveModules.size > 0) {
                bar.style.display = 'flex';
            } else {
                bar.style.display = 'none';
            }
        }

        function createEsp32ImgSource(url) {
            const img = document.createElement('img');
            img.crossOrigin = 'anonymous';
            img.style.display = 'none';
            img.src = url;
            return img;
        }

        // =================================================================
        // MODULE 1: FINGER TRACKING CONTROLLER
        // =================================================================
        const FingerTrackingModule = (() => {
            let camera = null;
            let hands = null;
            let currentFacingMode = 'user';
            let isRunning = false;
            let esp32Img = null;
            let esp32AnimId = null;

            const fingerCountDisplay = document.getElementById('ft-fingerCount');
            const videoElement = document.getElementById('ft-video');
            const canvasElement = document.getElementById('ft-output_canvas');
            const canvasCtx = canvasElement.getContext('2d');

            function setCanvasDimensions() {
                canvasElement.width = 480;
                canvasElement.height = 360;
            }

            function countFingers(lmlist) {
                let fingerCount = 0;
                const tipIds = [4, 8, 12, 16, 20];
                let isRightHand = lmlist[12][1] > lmlist[20][1];
                const isThumbRaised = isRightHand
                    ? lmlist[tipIds[0]][1] > lmlist[tipIds[0] - 1][1]
                    : lmlist[tipIds[0]][1] < lmlist[tipIds[0] - 1][1];
                if (isThumbRaised) fingerCount += 1;
                for (let i = 1; i < tipIds.length; i++) {
                    const isFingerRaised = lmlist[tipIds[i]][2] < lmlist[tipIds[i] - 2][2];
                    if (isFingerRaised) fingerCount += 1;
                }
                return fingerCount;
            }

            function onResults(results) {
                if (!isRunning) return;
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        const lmlist = [];
                        for (let id = 0; id < 21; id++) {
                            const lm = landmarks[id];
                            let x = lm.x * canvasElement.width;
                            let y = lm.y * canvasElement.height;
                            lmlist.push([id, Math.round(x), Math.round(y)]);
                        }

                        if (lmlist.length === 21) {
                            const fingerCount = countFingers(lmlist);
                            fingerCountDisplay.innerText = `Fingers Raised: ${fingerCount}`;
                        }

                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 5 });
                        drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 2 });
                    }
                }
                canvasCtx.restore();
            }

            function stopCameraStreams() {
                if (camera) { camera.stop(); camera = null; }
                if (videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(t => t.stop());
                    videoElement.srcObject = null;
                }
                if (esp32AnimId) { cancelAnimationFrame(esp32AnimId); esp32AnimId = null; }
                if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                globalEsp32ActiveModules.delete('ft');
                updateEsp32Bar();
            }

            function setupHands() {
                if (!hands) {
                    hands = new Hands({ locateFile: (file) => `${file}` });
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 0,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.5
                    });
                    hands.onResults(onResults);
                }
            }

            function startEsp32Feed() {
                if (!isRunning || window.globalCamModeIndex !== 2) return;
                globalEsp32ActiveModules.add('ft');
                updateEsp32Bar();
                esp32Img = createEsp32ImgSource(globalEsp32Url);
                document.body.appendChild(esp32Img);
                setupHands();
                function esp32Loop() {
                    if (!isRunning || window.globalCamModeIndex !== 2) return;
                    if (esp32Img.complete && esp32Img.naturalWidth > 0) {
                        if (hands) hands.send({ image: esp32Img }).catch(() => { });
                    }
                    esp32AnimId = requestAnimationFrame(esp32Loop);
                }
                esp32Img.onload = () => { esp32AnimId = requestAnimationFrame(esp32Loop); };
                esp32Img.onerror = () => {
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    canvasCtx.fillStyle = '#1e293b';
                    canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                    canvasCtx.fillStyle = '#64748b';
                    canvasCtx.font = 'bold 24px sans-serif';
                    canvasCtx.textAlign = 'center';
                    canvasCtx.fillText('📡 ESP32 Offline', canvasElement.width / 2, canvasElement.height / 2);
                    canvasCtx.font = '16px sans-serif';
                    canvasCtx.fillText(globalEsp32Url, canvasElement.width / 2, canvasElement.height / 2 + 36);
                };
            }

            let isProcessing = false;
            function startCamera() {
                if (window.globalCamModeIndex === 2) {
                    startEsp32Feed();
                    return;
                }
                currentFacingMode = CAM_MODES[window.globalCamModeIndex];
                setupHands();
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (!isRunning || !hands || isProcessing) return;
                        isProcessing = true;
                        try {
                            await hands.send({ image: videoElement });
                        } catch (err) {
                        } finally {
                            isProcessing = false;
                        }
                    },
                    width: 480,
                    height: 360,
                    facingMode: currentFacingMode,
                });
                camera.start().catch(err => {
                    console.error('FT camera error:', err);
                    canvasCtx.fillStyle = '#1e293b';
                    canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                    canvasCtx.fillStyle = '#ef4444';
                    canvasCtx.font = 'bold 22px sans-serif';
                    canvasCtx.textAlign = 'center';
                    canvasCtx.fillText('📷 Camera Error', canvasElement.width / 2, canvasElement.height / 2);
                    canvasCtx.font = '14px sans-serif';
                    canvasCtx.fillStyle = '#94a3b8';
                    canvasCtx.fillText(err.message, canvasElement.width / 2, canvasElement.height / 2 + 30);
                });
            }

            return {
                start: () => {
                    isRunning = true;
                    window._activeVisionModule = {
                        isEsp32Mode: () => window.globalCamModeIndex === 2,
                        restartEsp32: () => { stopCameraStreams(); startCamera(); },
                        restartCamera: () => { stopCameraStreams(); startCamera(); }
                    };
                    setCanvasDimensions();
                    startCamera();
                },
                stop: () => {
                    isRunning = false;
                    stopCameraStreams();
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                }
            };
        })();

        // =================================================================
        // MODULE 2: GESTURE CLASSIFIER CONTROLLER
        // =================================================================
        const GestureClassifierModule = (() => {
            const knn = new LandmarkKNNClassifier(5);
            let recordingLabel = null;
            let camera = null;
            let hands = null;
            let currentFacingMode = 'user';
            let isRunning = false;
            let esp32Img = null;
            let esp32AnimId = null;

            const gcStatusDisplay = document.getElementById('gc-status');
            const videoElement = document.getElementById('gc-video');
            const canvasElement = document.getElementById('gc-output_canvas');
            const canvasCtx = canvasElement.getContext('2d');

            function setCanvasDimensions() {
                canvasElement.width = 480;
                canvasElement.height = 360;
            }

            function extractFeatures(landmarks) {
                let wrist = landmarks[0];
                let features = [];
                let maxDist = 0;
                for (let i = 1; i < landmarks.length; i++) {
                    let dx = landmarks[i].x - wrist.x;
                    let dy = landmarks[i].y - wrist.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxDist) maxDist = dist;
                }
                for (let i = 0; i < landmarks.length; i++) {
                    let dx = landmarks[i].x - wrist.x;
                    let dy = landmarks[i].y - wrist.y;
                    if (maxDist > 0) {
                        features.push(dx / maxDist);
                        features.push(dy / maxDist);
                    } else {
                        features.push(dx);
                        features.push(dy);
                    }
                }
                return features;
            }

            let fixedAutoTrainTarget = null;
            let fixedAutoTrainCount = 0;
            let lastSelectedLabel = 1;

            function trainFixed(label, count = 20) {
                recordingLabel = parseInt(label, 10) || 1;
                lastSelectedLabel = recordingLabel;
                fixedAutoTrainTarget = count;
                fixedAutoTrainCount = 0;
                gcStatusDisplay.innerText = `Training Gesture ${recordingLabel}: 0/${count} samples...`;
                gcStatusDisplay.style.color = "#eab308";
            }

            function onResults(results) {
                if (!isRunning) return;
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        let features = extractFeatures(landmarks);
                        if (recordingLabel !== null) {
                            knn.addExample(features, recordingLabel);
                            if (fixedAutoTrainTarget !== null) {
                                fixedAutoTrainCount++;
                                gcStatusDisplay.innerText = `Training Gesture ${recordingLabel}: ${fixedAutoTrainCount}/${fixedAutoTrainTarget} samples...`;
                                gcStatusDisplay.style.color = "#eab308";

                                if (fixedAutoTrainCount >= fixedAutoTrainTarget) {
                                    gcStatusDisplay.innerText = `Finished! Gesture ${recordingLabel} trained (${fixedAutoTrainTarget} samples).`;
                                    gcStatusDisplay.style.color = "#00ff66";
                                    recordingLabel = null;
                                    fixedAutoTrainTarget = null;
                                    setTimeout(() => { if (!recordingLabel && knn.data.length > 0) gcStatusDisplay.innerText = 'Prediction: Ready'; }, 2500);
                                }
                            }
                        } else {
                            let pred = knn.predict(features);
                            if (pred !== null) {
                                gcStatusDisplay.innerText = `Prediction: ${pred}`;
                                gcStatusDisplay.style.color = "#00ff66";
                            } else {
                                gcStatusDisplay.innerText = `Prediction: None`;
                                gcStatusDisplay.style.color = "#00ff66";
                            }
                        }

                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 5 });
                        drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 2 });
                    }
                } else {
                    if (knn.data.length > 0) {
                        gcStatusDisplay.innerText = `Prediction: None`;
                        gcStatusDisplay.style.color = "#00ff66";
                    } else {
                        gcStatusDisplay.innerText = 'Hold a number to train';
                        gcStatusDisplay.style.color = "#00ff66";
                    }
                }
                canvasCtx.restore();
            }

            function initEvents() {
                setCanvasDimensions();

                document.querySelectorAll('.gc-gestureBtn').forEach(btn => {
                    btn.addEventListener('pointerdown', (e) => {
                        recordingLabel = parseInt(e.target.dataset.label);
                        lastSelectedLabel = recordingLabel;
                        fixedAutoTrainTarget = null;
                        gcStatusDisplay.innerText = `Recording label ${recordingLabel}...`;
                        gcStatusDisplay.style.color = "#ef4444";
                    });
                    const stopRecording = (e) => {
                        if (fixedAutoTrainTarget === null && recordingLabel === parseInt(e.target.dataset.label)) {
                            recordingLabel = null;
                            gcStatusDisplay.innerText = 'Ready';
                            gcStatusDisplay.style.color = "#00ff66";
                        }
                    };
                    btn.addEventListener('pointerup', stopRecording);
                    btn.addEventListener('pointerleave', stopRecording);
                });

                const autoTrainBtn = document.getElementById('gc-autoTrainBtn');
                if (autoTrainBtn) {
                    autoTrainBtn.addEventListener('click', () => {
                        trainFixed(lastSelectedLabel || 1, 20);
                    });
                }

                document.getElementById('gc-clearDataBtn').addEventListener('click', () => {
                    knn.clear();
                    gcStatusDisplay.innerText = `Prediction: None`;
                });
            }

            function setupHands() {
                if (!hands) {
                    hands = new Hands({ locateFile: (file) => `${file}` });
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 0,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.5
                    });
                    hands.onResults(onResults);
                }
            }

            function stopGcCameraStreams() {
                if (camera) { camera.stop(); camera = null; }
                if (videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(t => t.stop());
                    videoElement.srcObject = null;
                }
                if (esp32AnimId) { cancelAnimationFrame(esp32AnimId); esp32AnimId = null; }
                if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                globalEsp32ActiveModules.delete('gc');
                updateEsp32Bar();
            }

            let isProcessing = false;
            function startCamera() {
                if (window.globalCamModeIndex === 2) {
                    // ESP32 MJPEG mode
                    globalEsp32ActiveModules.add('gc');
                    updateEsp32Bar();
                    esp32Img = createEsp32ImgSource(globalEsp32Url);
                    document.body.appendChild(esp32Img);
                    setupHands();
                    function gcEsp32Loop() {
                        if (!isRunning || window.globalCamModeIndex !== 2) return;
                        if (esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) {
                            if (hands && !isProcessing) {
                                isProcessing = true;
                                hands.send({ image: esp32Img }).catch(() => { }).finally(() => { isProcessing = false; });
                            }
                        }
                        esp32AnimId = requestAnimationFrame(gcEsp32Loop);
                    }
                    esp32Img.onload = () => { esp32AnimId = requestAnimationFrame(gcEsp32Loop); };
                    esp32Img.onerror = () => {
                        canvasCtx.fillStyle = '#1e293b'; canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                        canvasCtx.fillStyle = '#64748b'; canvasCtx.font = 'bold 24px sans-serif'; canvasCtx.textAlign = 'center';
                        canvasCtx.fillText('📡 ESP32 Offline', canvasElement.width / 2, canvasElement.height / 2);
                    };
                    return;
                }
                currentFacingMode = CAM_MODES[window.globalCamModeIndex];
                setupHands();
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (!isRunning || !hands || isProcessing) return;
                        isProcessing = true;
                        try {
                            await hands.send({ image: videoElement });
                        } catch (err) {
                        } finally {
                            isProcessing = false;
                        }
                    },
                    width: 480,
                    height: 360,
                    facingMode: currentFacingMode,
                });
                camera.start().catch(err => console.error('GC cam:', err));
            }

            initEvents();

            return {
                start: () => {
                    isRunning = true;
                    window._activeVisionModule = {
                        isEsp32Mode: () => window.globalCamModeIndex === 2,
                        restartEsp32: () => { stopGcCameraStreams(); startCamera(); },
                        restartCamera: () => { stopGcCameraStreams(); startCamera(); }
                    };
                    setCanvasDimensions();
                    startCamera();
                },
                stop: () => {
                    isRunning = false;
                    stopGcCameraStreams();
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                },
                trainFixed: (label, count = 20) => trainFixed(label, count)
            };
        })();

        // =================================================================
        // MODULE 3: IMAGE CLASSIFIER (TEACHABLE WEBCAM)
        // =================================================================
        const ImageClassifierModule = (() => {
            const video = document.getElementById('ic-webcam');
            const statusEl = document.getElementById('ic-status');
            const classifier = knnClassifier.create();

            let net = null;
            let isTraining = false;
            let currentTrainClass = null;
            let lastLogged = null;
            let sameCount = 0;
            let isRunning = false;
            let animId = null;
            let currentFacingMode = 'user';
            let esp32Img = null;
            let modelLoaded = false;

            const STABLE_FRAMES = 2;
            const CONFIDENCE_THRESHOLD = 0.65;
            const INTERVAL = 160;

            function logStable(value) {
                if (value === lastLogged) sameCount++;
                else {
                    lastLogged = value;
                    sameCount = 1;
                }
                if (sameCount >= STABLE_FRAMES) {
                    console.log(value);
                }
            }

            function updateBadges() {
                const counts = classifier.getNumClasses() > 0 ? classifier.getClassExampleCount() : {};
                document.querySelectorAll('.ic-train-btn').forEach(btn => {
                    const cId = btn.dataset.class;
                    const count = counts[cId] || 0;
                    const badge = btn.querySelector('.badge');
                    if (badge) {
                        badge.textContent = count;
                        if (count > 0) btn.classList.add('has-data');
                        else btn.classList.remove('has-data');
                    }
                });
            }

            async function setupWebcam() {
                if (window.globalCamModeIndex === 2) {
                    // ESP32 mode: use img element as source
                    if (video.srcObject) {
                        video.srcObject.getTracks().forEach(t => t.stop());
                        video.srcObject = null;
                    }
                    if (!esp32Img) {
                        esp32Img = createEsp32ImgSource(globalEsp32Url);
                        document.body.appendChild(esp32Img);
                        globalEsp32ActiveModules.add('ic');
                        updateEsp32Bar();
                    }
                    return new Promise(r => {
                        esp32Img.onload = r;
                        if (esp32Img.complete && esp32Img.naturalWidth > 0) r();
                    });
                }
                if (esp32Img) {
                    esp32Img.src = ''; esp32Img.remove(); esp32Img = null;
                    globalEsp32ActiveModules.delete('ic');
                    updateEsp32Bar();
                }
                currentFacingMode = CAM_MODES[window.globalCamModeIndex];
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 480 },
                        height: { ideal: 360 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise(r => video.onloadeddata = r);
            }

            async function addExample(classId) {
                if (!net) return;
                const img = tf.browser.fromPixels(video);
                const activation = net.infer(img, true);
                classifier.addExample(activation, classId);
                img.dispose();
                activation.dispose();
                updateBadges();
            }

            let lastSelectedClass = 1;
            async function trainFixed(classId, count = 20) {
                if (!net) return;
                const targetClass = parseInt(classId, 10) || 1;
                lastSelectedClass = targetClass;
                const trainBtn = document.querySelector(`.ic-train-btn[data-class="${targetClass}"]`);
                if (trainBtn) trainBtn.classList.add('holding');
                statusEl.textContent = `Training Button ${targetClass}: 0/${count} images...`;
                for (let i = 1; i <= count; i++) {
                    await addExample(targetClass);
                    statusEl.textContent = `Training Button ${targetClass}: ${i}/${count} images...`;
                    await new Promise(r => setTimeout(r, 60));
                }
                if (trainBtn) trainBtn.classList.remove('holding');
                const counts = classifier.getClassExampleCount();
                statusEl.textContent = `Done! Button ${targetClass} trained (${count} images) • Total: ${JSON.stringify(counts)}`;
            }

            function initEvents() {
                document.querySelectorAll('.ic-train-btn').forEach(btn => {
                    const classId = Number(btn.dataset.class);
                    if (isNaN(classId)) return; // Exclude non-numbered buttons

                    const start = (e) => {
                        e.preventDefault();
                        isTraining = true;
                        currentTrainClass = classId;
                        lastSelectedClass = classId;
                        btn.classList.add('holding');
                        statusEl.textContent = `Training class ${classId}...`;
                    };
                    const stop = () => {
                        isTraining = false;
                        currentTrainClass = null;
                        btn.classList.remove('holding');
                        const counts = classifier.getClassExampleCount();
                        statusEl.textContent = `Ready • Examples: ${JSON.stringify(counts)}`;
                    };
                    btn.addEventListener('touchstart', start, { passive: false });
                    btn.addEventListener('mousedown', start);
                    btn.addEventListener('touchend', stop);
                    btn.addEventListener('mouseup', stop);
                    btn.addEventListener('touchcancel', stop);
                    btn.addEventListener('mouseleave', stop);
                });

                const autoTrainBtn = document.getElementById('ic-autoTrainBtn');
                if (autoTrainBtn) {
                    autoTrainBtn.addEventListener('click', async () => {
                        await trainFixed(lastSelectedClass || 1, 20);
                    });
                }

                document.getElementById('ic-clear-btn').addEventListener('click', () => {
                    if (classifier.getNumClasses() > 0) {
                        classifier.clearAllClasses();
                    }
                    updateBadges();
                    statusEl.textContent = 'Ready – hold a number to train';
                    console.log("Memory cleared.");
                });
            }

            initEvents();

            async function runLoop() {
                let lastRun = 0;
                let isPredicting = false;
                async function loop(ts) {
                    if (!isRunning) return;

                    // Prevent Float32Array error by strictly checking video/img dimensions before passing to TensorFlow
                    let isSourceReady = false;
                    const imgSource = window.globalCamModeIndex === 2 ? esp32Img : video;

                    if (window.globalCamModeIndex === 2) {
                        isSourceReady = esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0 && esp32Img.naturalHeight > 0;
                    } else {
                        isSourceReady = video && video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0;
                    }

                    if (ts - lastRun < INTERVAL || !isSourceReady || isPredicting) {
                        animId = requestAnimationFrame(loop);
                        return;
                    }

                    lastRun = ts;

                    if (isTraining && currentTrainClass) {
                        if (!net || !imgSource) { animId = requestAnimationFrame(loop); return; }
                        isPredicting = true;
                        try {
                            const tfImg = tf.browser.fromPixels(imgSource);
                            const activation = net.infer(tfImg, true);
                            classifier.addExample(activation, currentTrainClass);
                            tfImg.dispose(); activation.dispose();
                            updateBadges();

                            // Self-correct error text if recovered
                            if (statusEl.textContent.startsWith('Error:')) {
                                statusEl.textContent = `Ready • Examples: ${JSON.stringify(classifier.getClassExampleCount())}`;
                            }
                        } catch (e) {
                            // Silently ignore transient dimension errors during flip
                        } finally {
                            isPredicting = false;
                        }
                        animId = requestAnimationFrame(loop);
                        return;
                    }

                    if (classifier.getNumClasses() > 0 && net && imgSource) {
                        isPredicting = true;
                        try {
                            const tfImg = tf.browser.fromPixels(imgSource);
                            const activation = net.infer(tfImg, true);
                            const result = await classifier.predictClass(activation);
                            tfImg.dispose(); activation.dispose();
                            const conf = result.confidences[result.label];
                            if (conf >= CONFIDENCE_THRESHOLD) { logStable(Number(result.label)); }

                            // Self-correct error text if recovered
                            if (statusEl.textContent.startsWith('Error:')) {
                                statusEl.textContent = `Ready • Examples: ${JSON.stringify(classifier.getClassExampleCount())}`;
                            }
                        } catch (e) {
                            // Silently ignore transient dimension errors during flip
                        } finally {
                            isPredicting = false;
                        }
                    }

                    animId = requestAnimationFrame(loop);
                }
                animId = requestAnimationFrame(loop);
            }

            return {
                start: async () => {
                    isRunning = true;
                    window._activeVisionModule = {
                        isEsp32Mode: () => window.globalCamModeIndex === 2,
                        restartEsp32: () => {
                            if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                            globalEsp32ActiveModules.delete('ic');
                            updateEsp32Bar();
                            if (isRunning) setupWebcam();
                        },
                        restartCamera: () => {
                            if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                            globalEsp32ActiveModules.delete('ic');
                            updateEsp32Bar();
                            if (isRunning) setupWebcam();
                        }
                    };
                    try {
                        if (!modelLoaded) {
                            statusEl.textContent = 'Loading TensorFlow & MobileNet...';
                            await tf.setBackend('webgl');
                            await tf.ready();
                            net = await mobilenet.load({ version: 2, alpha: 0.5, modelUrl: 'model.json' });
                            modelLoaded = true;
                        }
                        statusEl.textContent = 'Starting camera...';
                        await setupWebcam();
                        statusEl.textContent = 'Ready – hold a number to train';
                        runLoop();
                    } catch (err) {
                        console.error(err);
                        statusEl.textContent = `Error: ${err.name} - ${err.message}`;
                    }
                },
                stop: () => {
                    isRunning = false;
                    if (animId) cancelAnimationFrame(animId);
                    if (video.srcObject) {
                        video.srcObject.getTracks().forEach(t => t.stop());
                        video.srcObject = null;
                    }
                    if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                    globalEsp32ActiveModules.delete('ic');
                    updateEsp32Bar();
                },
                trainFixed: async (classId, count = 20) => { await trainFixed(classId, count); }
            };
        })();

        // =================================================================
        // RGB TRACKER FACTORY (For Coords, ColorPicker, Grid)
        // =================================================================
        function createRGBTrackerModule(cfg) {
            const video = document.getElementById(cfg.videoId);
            const outputCanvas = document.getElementById(cfg.outputCanvasId);
            const ctxOutput = outputCanvas.getContext('2d');
            const procCanvas = document.getElementById(cfg.procCanvasId);
            const ctxProc = procCanvas.getContext('2d', { willReadFrequently: true });

            const targetBox = document.getElementById(cfg.boxId);
            const btnAction = document.getElementById(cfg.btnActionId);
            const statusInd = document.getElementById(cfg.statusId);
            const uiPosX = document.getElementById(cfg.posXId);
            const uiPosY = document.getElementById(cfg.posYId);
            const uiBlobSize = document.getElementById(cfg.blobSizeId);
            const colorPreview = document.getElementById(cfg.previewId);

            const PROC_WIDTH = 160;
            const PROC_HEIGHT = 120;
            procCanvas.width = PROC_WIDTH;
            procCanvas.height = PROC_HEIGHT;

            let appState = 0; // 0=Init, 1=Select, 2=Track
            let currentFacingMode = 'user';
            let isRunning = false;
            let animId = null;
            let esp32Img = null;
            // A pseudo-unique key for the module to track its ESP32 stream status
            const moduleKey = cfg.videoId;

            const THRESH_HUE = 15;
            const THRESH_SAT = 0.35;
            const THRESH_VAL = 0.40;
            const MIN_BLOB_SIZE = 5;

            let targetProfile = { h: 0, s: 0, v: 0, size: 0, whRatio: 1.0 };
            let tracker = {
                x: PROC_WIDTH / 2, y: PROC_HEIGHT / 2,
                vx: 0, vy: 0,
                framesDetected: 0, framesLost: 0, isLocked: false,
                roi: [0, 0, PROC_WIDTH, PROC_HEIGHT]
            };

            const ALPHA = 0.6;
            const BETA = 0.3;
            let lastGridNum = null;

            function stopRgbCameraStreams() {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }
                if (esp32Img) { esp32Img.src = ''; esp32Img.remove(); esp32Img = null; }
                globalEsp32ActiveModules.delete(moduleKey);
                updateEsp32Bar();
            }

            async function startCamera() {
                if (window.globalCamModeIndex === 2) {
                    // ESP32 MJPEG mode
                    globalEsp32ActiveModules.add(moduleKey);
                    updateEsp32Bar();
                    esp32Img = createEsp32ImgSource(globalEsp32Url);
                    document.body.appendChild(esp32Img);

                    const onEsp32Ready = () => {
                        outputCanvas.width = esp32Img.naturalWidth || 640;
                        outputCanvas.height = esp32Img.naturalHeight || 480;
                        btnAction.style.display = 'block';
                        appState = 1;
                        targetBox.style.display = 'block';
                        statusInd.innerText = 'SELECT TARGET';
                        statusInd.style.background = 'rgba(0,0,0,0.6)';
                        if (isRunning && !animId) renderLoop();
                    };
                    esp32Img.onload = onEsp32Ready;
                    esp32Img.onerror = () => {
                        statusInd.innerText = '📡 ESP32 OFFLINE';
                        statusInd.style.background = 'rgba(239,68,68,0.8)';
                    };
                    return;
                }
                currentFacingMode = CAM_MODES[window.globalCamModeIndex];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        outputCanvas.width = video.videoWidth || 640;
                        outputCanvas.height = video.videoHeight || 480;
                        video.play();

                        btnAction.style.display = 'block';
                        appState = 1;
                        targetBox.style.display = 'block';
                        statusInd.innerText = 'SELECT TARGET';
                        statusInd.style.background = 'rgba(0,0,0,0.6)';

                        if (isRunning && !animId) renderLoop();
                    };
                } catch (err) {
                    statusInd.innerText = '📷 Camera Error';
                    statusInd.style.background = 'rgba(239,68,68,0.8)';
                    console.error('RGB cam error:', err);
                }
            }

            function handleAction() {
                if (appState === 1) {
                    captureTargetProfile();
                    appState = 2; // Track
                    targetBox.style.display = 'none';
                    btnAction.innerText = 'Reset target';
                    btnAction.style.background = '#475569';
                } else if (appState === 2) {
                    appState = 1; // Select
                    targetBox.style.display = 'block';
                    btnAction.innerText = 'Capture target';
                    btnAction.style.background = '#10b981';

                    uiPosX.innerText = '-'; uiPosY.innerText = '-'; uiBlobSize.innerText = '-';
                    colorPreview.style.background = '#000';
                    statusInd.innerText = "SELECT TARGET";
                    statusInd.style.background = "rgba(0,0,0,0.6)";
                    lastGridNum = null;
                }
            }

            function captureTargetProfile() {
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete) ? esp32Img : video;
                ctxOutput.drawImage(src, 0, 0, outputCanvas.width, outputCanvas.height);
                const cx = outputCanvas.width / 2, cy = outputCanvas.height / 2, box = 40;
                const imgData = ctxOutput.getImageData(cx - box / 2, cy - box / 2, box, box).data;

                let sats = [], vals = [], sumSin = 0, sumCos = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    const hsv = rgbToHsv(imgData[i], imgData[i + 1], imgData[i + 2]);
                    sats.push(hsv.s); vals.push(hsv.v);
                    let rad = hsv.h * Math.PI / 180;
                    sumSin += Math.sin(rad); sumCos += Math.cos(rad);
                }
                const getMed = (arr) => { arr.sort((a, b) => a - b); const m = Math.floor(arr.length / 2); return arr.length % 2 !== 0 ? arr[m] : (arr[m - 1] + arr[m]) / 2; };

                targetProfile.h = (Math.atan2(sumSin, sumCos) * 180 / Math.PI + 360) % 360;
                targetProfile.s = getMed(sats);
                targetProfile.v = getMed(vals);

                const ratioX = PROC_WIDTH / outputCanvas.width;
                const ratioY = PROC_HEIGHT / outputCanvas.height;
                targetProfile.size = (box * ratioX) * (box * ratioY) * 0.8;
                targetProfile.whRatio = 1.0;

                tracker.x = PROC_WIDTH / 2;
                tracker.y = PROC_HEIGHT / 2;
                tracker.vx = 0; tracker.vy = 0;
                tracker.framesDetected = 0; tracker.framesLost = 0;
                tracker.isLocked = false;
                tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];

                const rgb = hsvToRgb(targetProfile.h, targetProfile.s, targetProfile.v);
                colorPreview.style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                statusInd.innerText = "INITIALIZING TRACKER...";
            }

            function findAllBlobs(binaryMask, minX, minY, maxX, maxY) {
                const visited = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);
                const blobs = [];
                const q = new Uint32Array(PROC_WIDTH * PROC_HEIGHT);

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        const idx = y * PROC_WIDTH + x;
                        if (binaryMask[idx] === 1 && visited[idx] === 0) {
                            let head = 0, tail = 0;
                            q[tail++] = idx;
                            visited[idx] = 1;

                            let bx1 = x, bx2 = x, by1 = y, by2 = y, size = 0;
                            let sumX = 0, sumY = 0;

                            while (head < tail) {
                                const curr = q[head++];
                                const cx = curr % PROC_WIDTH, cy = Math.floor(curr / PROC_WIDTH);

                                bx1 = Math.min(bx1, cx); bx2 = Math.max(bx2, cx);
                                by1 = Math.min(by1, cy); by2 = Math.max(by2, cy);
                                sumX += cx; sumY += cy;
                                size++;

                                if (cy > minY) { const n = curr - PROC_WIDTH; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cy < maxY - 1) { const n = curr + PROC_WIDTH; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cx > minX) { const n = curr - 1; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                                if (cx < maxX - 1) { const n = curr + 1; if (binaryMask[n] === 1 && !visited[n]) { visited[n] = 1; q[tail++] = n; } }
                            }

                            if (size >= MIN_BLOB_SIZE) {
                                let w = bx2 - bx1 + 1;
                                let h = by2 - by1 + 1;
                                blobs.push({
                                    x: bx1, y: by1, w: w, h: h, size: size,
                                    cx: sumX / size, cy: sumY / size,
                                    ratio: w / h
                                });
                            }
                        }
                    }
                }
                return blobs;
            }

            function scoreBlobArray(blobs, predX, predY) {
                let bestBlob = null;
                let highestScore = -1;

                for (let b of blobs) {
                    let sizeRatio = b.size / targetProfile.size;
                    let sizeScore = sizeRatio > 1 ? (1 / sizeRatio) : sizeRatio;
                    let ratioDiff = Math.abs(b.ratio - targetProfile.whRatio);
                    let shapeScore = Math.max(0, 1 - ratioDiff);
                    let dx = b.cx - predX;
                    let dy = b.cy - predY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let distScore = Math.max(0, 1 - (dist / (PROC_WIDTH * 0.3)));
                    let score = (0.4 * sizeScore) + (0.2 * shapeScore) + (0.4 * distScore);

                    if (score > highestScore) {
                        highestScore = score;
                        bestBlob = b;
                    }
                }
                return { bestBlob, highestScore };
            }

            function executeTracker() {
                let minX = tracker.roi[0], minY = tracker.roi[1];
                let maxX = tracker.roi[2], maxY = tracker.roi[3];
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) ? esp32Img : video;
                ctxProc.drawImage(src, 0, 0, PROC_WIDTH, PROC_HEIGHT);
                const data = ctxProc.getImageData(0, 0, PROC_WIDTH, PROC_HEIGHT).data;
                const mask = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        let i = (y * PROC_WIDTH + x) * 4;
                        const hsv = rgbToHsv(data[i], data[i + 1], data[i + 2]);
                        if (Math.abs(hsv.s - targetProfile.s) <= THRESH_SAT &&
                            Math.abs(hsv.v - targetProfile.v) <= THRESH_VAL &&
                            hueDist(hsv.h, targetProfile.h) <= THRESH_HUE) {
                            mask[y * PROC_WIDTH + x] = 1;
                        }
                    }
                }

                const blobs = findAllBlobs(mask, minX, minY, maxX, maxY);
                let predX = tracker.x + tracker.vx;
                let predY = tracker.y + tracker.vy;
                const { bestBlob, highestScore } = scoreBlobArray(blobs, predX, predY);

                if (bestBlob && highestScore > 0.1) {
                    tracker.framesLost = 0;
                    tracker.framesDetected++;
                    if (tracker.framesDetected >= 2) tracker.isLocked = true;

                    let measurementX = bestBlob.cx;
                    let measurementY = bestBlob.cy;
                    tracker.x = predX + ALPHA * (measurementX - predX);
                    tracker.y = predY + ALPHA * (measurementY - predY);
                    tracker.vx = tracker.vx + BETA * (measurementX - predX);
                    tracker.vy = tracker.vy + BETA * (measurementY - predY);

                    targetProfile.size = (0.8 * targetProfile.size) + (0.2 * bestBlob.size);
                    targetProfile.whRatio = (0.8 * targetProfile.whRatio) + (0.2 * bestBlob.ratio);
                } else {
                    tracker.framesDetected = 0;
                    tracker.framesLost++;
                    if (tracker.framesLost >= 10) tracker.isLocked = false;
                    tracker.x = predX;
                    tracker.y = predY;
                    tracker.vx *= 0.8;
                    tracker.vy *= 0.8;
                }

                if (tracker.isLocked) {
                    statusInd.innerText = "LOCKED";
                    statusInd.style.background = "rgba(16, 185, 129, 0.8)";
                    let padding = 30;
                    tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                    tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                    tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                    tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
                } else {
                    if (tracker.framesLost < 20) {
                        statusInd.innerText = "RECOVERING...";
                        statusInd.style.background = "rgba(245, 158, 11, 0.8)";
                        let padding = 50 + (tracker.framesLost * 2);
                        tracker.roi[0] = Math.max(0, Math.floor(tracker.x - padding));
                        tracker.roi[1] = Math.max(0, Math.floor(tracker.y - padding));
                        tracker.roi[2] = Math.min(PROC_WIDTH, Math.ceil(tracker.x + padding));
                        tracker.roi[3] = Math.min(PROC_HEIGHT, Math.ceil(tracker.y + padding));
                    } else {
                        statusInd.innerText = "LOST";
                        statusInd.style.background = "rgba(239, 68, 68, 0.8)";
                        tracker.roi = [0, 0, PROC_WIDTH, PROC_HEIGHT];
                    }
                }

                return { x: tracker.x, y: tracker.y, blob: bestBlob, isLocked: tracker.isLocked };
            }

            function renderLoop() {
                if (!isRunning) return;
                // Use esp32Img as source if in ESP32 mode
                const src = (window.globalCamModeIndex === 2 && esp32Img && esp32Img.complete && esp32Img.naturalWidth > 0) ? esp32Img : video;
                if (window.globalCamModeIndex === 2 && (!esp32Img || !esp32Img.complete || !esp32Img.naturalWidth)) {
                    animId = requestAnimationFrame(renderLoop);
                    return;
                }
                ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                ctxOutput.drawImage(src, 0, 0, outputCanvas.width, outputCanvas.height);

                // Mode: 3x3 Grid
                if (cfg.hasGrid) {
                    const cellW = outputCanvas.width / 3;
                    const cellH = outputCanvas.height / 3;
                    ctxOutput.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctxOutput.lineWidth = 1;
                    ctxOutput.beginPath();
                    ctxOutput.moveTo(cellW, 0); ctxOutput.lineTo(cellW, outputCanvas.height);
                    ctxOutput.moveTo(cellW * 2, 0); ctxOutput.lineTo(cellW * 2, outputCanvas.height);
                    ctxOutput.moveTo(0, cellH); ctxOutput.lineTo(outputCanvas.width, cellH);
                    ctxOutput.moveTo(0, cellH * 2); ctxOutput.lineTo(outputCanvas.width, cellH * 2);
                    ctxOutput.stroke();
                }

                if (appState === 2) {
                    // When in ESP32 mode, draw from esp32Img into proc canvas
                    if (window.globalCamModeIndex === 2 && esp32Img) {
                        try { ctxProc.drawImage(esp32Img, 0, 0, PROC_WIDTH, PROC_HEIGHT); } catch (e) { }
                    }
                    const res = executeTracker();
                    const scaleX = outputCanvas.width / PROC_WIDTH;
                    const scaleY = outputCanvas.height / PROC_HEIGHT;

                    if (res.isLocked || tracker.framesLost < 20) {
                        const rx = tracker.roi[0] * scaleX, ry = tracker.roi[1] * scaleY;
                        const rw = (tracker.roi[2] - tracker.roi[0]) * scaleX;
                        const rh = (tracker.roi[3] - tracker.roi[1]) * scaleY;
                        ctxOutput.strokeStyle = 'rgba(255,255,255,0.2)';
                        ctxOutput.lineWidth = 1;
                        ctxOutput.setLineDash([5, 5]);
                        ctxOutput.strokeRect(rx, ry, rw, rh);
                        ctxOutput.setLineDash([]);
                    }

                    if (res.blob && tracker.isLocked) {
                        const drawCX = res.x * scaleX;
                        const drawCY = res.y * scaleY;
                        const drawW = res.blob.w * scaleX;
                        const drawH = res.blob.h * scaleY;

                        ctxOutput.strokeStyle = '#0f0';
                        ctxOutput.lineWidth = 2;
                        ctxOutput.strokeRect(drawCX - drawW / 2, drawCY - drawH / 2, drawW, drawH);

                        ctxOutput.beginPath();
                        ctxOutput.arc(drawCX, drawCY, 4, 0, 2 * Math.PI);
                        ctxOutput.fillStyle = '#f00';
                        ctxOutput.fill();

                        ctxOutput.beginPath();
                        ctxOutput.moveTo(drawCX, drawCY);
                        ctxOutput.lineTo(drawCX + (tracker.vx * scaleX * 3), drawCY + (tracker.vy * scaleY * 3));
                        ctxOutput.strokeStyle = '#ff0';
                        ctxOutput.lineWidth = 2;
                        ctxOutput.stroke();

                        const displayX = Math.round(outputCanvas.width - drawCX);
                        uiPosX.innerText = displayX;
                        uiPosY.innerText = Math.round(drawCY);
                        uiBlobSize.innerText = Math.round(res.blob.size);

                        // Mode specific logging
                        if (cfg.logCoords) {
                            console.log(`X: ${displayX}, Y: ${Math.round(drawCY)}`);
                        }

                        if (cfg.hasGrid) {
                            let col = Math.floor(displayX / (outputCanvas.width / 3));
                            let row = Math.floor(drawCY / (outputCanvas.height / 3));
                            col = Math.max(0, Math.min(2, col));
                            row = Math.max(0, Math.min(2, row));
                            let currentGridNum = row * 3 + col + 1;
                            if (currentGridNum !== lastGridNum) {
                                console.log(currentGridNum);
                                lastGridNum = currentGridNum;
                            }
                        }
                    }
                }

                animId = requestAnimationFrame(renderLoop);
            }

            btnAction.addEventListener('click', handleAction);

            return {
                start: () => {
                    isRunning = true;
                    window._activeVisionModule = {
                        isEsp32Mode: () => window.globalCamModeIndex === 2,
                        restartEsp32: () => {
                            if (animId) { cancelAnimationFrame(animId); animId = null; }
                            stopRgbCameraStreams();
                            appState = 0;
                            startCamera();
                        },
                        restartCamera: () => {
                            if (animId) { cancelAnimationFrame(animId); animId = null; }
                            stopRgbCameraStreams();
                            appState = 0;
                            startCamera();
                        }
                    };
                    startCamera();
                },
                stop: () => {
                    isRunning = false;
                    if (animId) { cancelAnimationFrame(animId); animId = null; }
                    stopRgbCameraStreams();
                    ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                }
            };
        }

        // Initialize RGB Modules
        const RGBCoordinatesModule = createRGBTrackerModule({
            videoId: 'rgb-coord-video',
            outputCanvasId: 'rgb-coord-output',
            procCanvasId: 'rgb-coord-proc',
            boxId: 'rgb-coord-box',
            btnActionId: 'rgb-coord-action-btn',
            statusId: 'rgb-coord-status',
            posXId: 'rgb-coord-pos-x',
            posYId: 'rgb-coord-pos-y',
            blobSizeId: 'rgb-coord-blob-size',
            previewId: 'rgb-coord-preview',
            logCoords: true,
            hasGrid: false
        });

        const RGBColorPickerModule = createRGBTrackerModule({
            videoId: 'rgb-color-video',
            outputCanvasId: 'rgb-color-output',
            procCanvasId: 'rgb-color-proc',
            boxId: 'rgb-color-box',
            btnActionId: 'rgb-color-action-btn',
            statusId: 'rgb-color-status',
            posXId: 'rgb-color-pos-x',
            posYId: 'rgb-color-pos-y',
            blobSizeId: 'rgb-color-blob-size',
            previewId: 'rgb-color-preview',
            logCoords: false,
            hasGrid: false
        });

        const RGBGridModule = createRGBTrackerModule({
            videoId: 'rgb-grid-video',
            outputCanvasId: 'rgb-grid-output',
            procCanvasId: 'rgb-grid-proc',
            boxId: 'rgb-grid-box',
            btnActionId: 'rgb-grid-action-btn',
            statusId: 'rgb-grid-status',
            posXId: 'rgb-grid-pos-x',
            posYId: 'rgb-grid-pos-y',
            blobSizeId: 'rgb-grid-blob-size',
            previewId: 'rgb-grid-preview',
            logCoords: false,
            hasGrid: true
        });

        // =================================================================
        // GLOBAL BLOCK SWITCHER & LIFECYCLE COORDINATOR
        // =================================================================
        const modules = {
            'block-finger-tracking': FingerTrackingModule,
            'block-gesture-classifier': GestureClassifierModule,
            'block-image-classifier': ImageClassifierModule,
            'block-rgb-coords': RGBCoordinatesModule,
            'block-rgb-colorpicker': RGBColorPickerModule,
            'block-rgb-grid': RGBGridModule
        };

        let currentActiveBlockId = 'block-finger-tracking';

        function switchModule(targetBlockId) {
            if (targetBlockId === currentActiveBlockId && modules[targetBlockId]) {
                return;
            }

            // 1. Stop current active module
            if (currentActiveBlockId && modules[currentActiveBlockId]) {
                try {
                    modules[currentActiveBlockId].stop();
                } catch (e) {
                    console.warn(`Error stopping ${currentActiveBlockId}:`, e);
                }
            }

            // 2. Hide all block divs
            document.querySelectorAll('.app-block').forEach(b => b.classList.remove('active'));

            // 3. Show target block div
            const targetBlock = document.getElementById(targetBlockId);
            if (targetBlock) targetBlock.classList.add('active');

            currentActiveBlockId = targetBlockId;

            // 4. Start new module
            if (modules[targetBlockId]) {
                try {
                    modules[targetBlockId].start();
                } catch (e) {
                    console.error(`Error starting ${targetBlockId}:`, e);
                }
            }
        }

        // Start initial module on page load
        window.addEventListener('load', () => {
            if (modules[currentActiveBlockId]) {
                modules[currentActiveBlockId].start();
            }
        });

        // Global trigger for gesture classifier & image classifier clear option
        window.clearClassifiers = function () {
            // Trigger gesture classifier clear
            const gcBtn = document.getElementById('gc-clearDataBtn');
            if (gcBtn) gcBtn.click();
            // Trigger image classifier clear
            const icBtn = document.getElementById('ic-clear-btn');
            if (icBtn) icBtn.click();
            console.log("Classifier memory cleared via clearClassifiers().");
        };

        // Global trigger to train 20 images for Image or Gesture Classifier
        window.trainClassifier = async function (type, buttonId = 1, count = 20) {
            const classNum = parseInt(buttonId, 10) || 1;
            if (type === 'gesture') {
                switchModule('block-gesture-classifier');
                if (GestureClassifierModule && GestureClassifierModule.trainFixed) {
                    GestureClassifierModule.trainFixed(classNum, count);
                }
            } else {
                switchModule('block-image-classifier');
                if (ImageClassifierModule && ImageClassifierModule.trainFixed) {
                    await ImageClassifierModule.trainFixed(classNum, count);
                }
            }
            console.log(`Auto-trained ${type} classifier for Button ${classNum} (${count} images).`);
        };

        window.addEventListener('message', (event) => {
            if (event.data === 'clear_classifiers' || (event.data && event.data.action === 'clear_classifiers')) {
                window.clearClassifiers();
            } else if (event.data && (event.data.action === 'train_classifier' || event.data.type === 'train_classifier')) {
                const target = event.data.classifier || 'image';
                const button = event.data.button || event.data.classId || 1;
                const count = event.data.count || 20;
                window.trainClassifier(target, button, count);
            } else if (event.data === 'pause' || (event.data && event.data.action === 'pause')) {
                if (currentActiveBlockId && modules[currentActiveBlockId]) {
                    try { modules[currentActiveBlockId].stop(); } catch (e) { }
                }
            } else if (event.data === 'resume' || (event.data && event.data.action === 'resume')) {
                if (currentActiveBlockId && modules[currentActiveBlockId]) {
                    try { modules[currentActiveBlockId].start(); } catch (e) { }
                }
            } else if (event.data && (event.data.action === 'switch_module' || event.data.action === 'switch_div' || event.data.type === 'switch_module')) {
                const targetMod = event.data.module || event.data.div || event.data.targetBlockId || event.data.target;
                if (targetMod && typeof switchModule === 'function') {
                    switchModule(targetMod);
                }
            } else if (typeof event.data === 'string' && event.data.startsWith('block-')) {
                if (typeof switchModule === 'function') {
                    switchModule(event.data);
                }
            }
        });
    </script>
