name: flutter_application_1
description: "Snap Racer Controller App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/camera/

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true